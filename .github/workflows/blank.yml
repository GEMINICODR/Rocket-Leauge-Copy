                opacity: 1
            });
            const mesh = new THREE.Mesh(particleGeo, mat);
            mesh.position.copy(originPos).add(new THREE.Vector3(0, 1.4, 0));
            scene.add(mesh);

            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.75;
            const speed = 18 + Math.random() * 48;

            particles.push({
                mesh,
                vel: new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * speed,
                    Math.cos(phi) * speed * 0.85 + 8,
                    Math.sin(phi) * Math.sin(theta) * speed
                ),
                life: 0.9 + Math.random() * 0.45,
                maxLife: 1.35,
                scale: 1.8 + Math.random() * 1.4
            });
        }

        const smokeColors = [0x1e293b, 0x334155, 0x0f172a];
        for (let i = 0; i < 30; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: smokeColors[i % smokeColors.length],
                transparent: true,
                opacity: 0.85
            });
            const mesh = new THREE.Mesh(particleGeo, mat);
            mesh.position.copy(originPos).add(new THREE.Vector3((Math.random()-0.5)*3, 1.5 + Math.random()*2, (Math.random()-0.5)*3));
            scene.add(mesh);

            particles.push({
                mesh,
                vel: new THREE.Vector3(
                    (Math.random() - 0.5) * 11,
                    6 + Math.random() * 12,
                    (Math.random() - 0.5) * 11
                ),
                life: 1.6 + Math.random() * 0.6,
                maxLife: 2.2,
                scale: 2.8 + Math.random() * 1.8
            });
        }

        const ringGeo = new THREE.RingGeometry(1.5, 3.0, 32);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0xfb923c,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.95
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2;
        ringMesh.position.set(originPos.x, 0.35, originPos.z);
        scene.add(ringMesh);
        shockwaves.push({ mesh: ringMesh, life: 0.58, maxLife: 0.58 });
