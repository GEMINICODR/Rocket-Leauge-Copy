    // ==========================================
    // 3. TRUE 3D CURVED STADIUM SURFACE-NORMAL SOLVER
    // ==========================================
    /**
     * Queries the exact closest surface point and inward unit surface normal inside
     * the curved quarter-pipe stadium (including flat turf, curved side ramps,
     * curved backboard ramps outside the goal mouths, rounded corner bowls,
     * vertical walls, and ceiling).
     */
    function queryArenaSurface(pos, objectRadius = 0) {
        const R = ARENA.CURVE_R;
        const CR = ARENA.CORNER_R;
        const innerX = ARENA.HALF_W - R;
        const innerZ = ARENA.HALF_L - R;
        const inGoalOpening = Math.abs(pos.x) < (ARENA.GOAL_HALF_W - objectRadius * 0.35) &&
                              pos.y < (ARENA.GOAL_H - objectRadius * 0.25);

        // 1. Check Ceiling First
        if (pos.y > ARENA.WALL_H - objectRadius - 2.0) {
            const distCeil = (ARENA.WALL_H - objectRadius) - pos.y;
            if (distCeil <= 2.5) {
                return {
                    normal: new THREE.Vector3(0, -1, 0),
                    signedDist: distCeil,
                    surfaceType: 'CEILING'
                };
            }
        }

        // 2. Inside Goal Tunnel (beyond +-HALF_L inside goal mouth)
        if (inGoalOpening && Math.abs(pos.z) > ARENA.HALF_L - 1.0) {
            const distFloor = pos.y - objectRadius;
            return {
                normal: new THREE.Vector3(0, 1, 0),
                signedDist: distFloor,
                surfaceType: 'GOAL_FLOOR'
            };
        }

        // 3. Rounded Corner Bowl Quarter-Pipe Transition (where |x| > HALF_W - CORNER_R and |z| > HALF_L - CORNER_R)
        const cornerCenterX = Math.sign(pos.x || 1) * (ARENA.HALF_W - CR);
        const cornerCenterZ = Math.sign(pos.z || 1) * (ARENA.HALF_L - CR);
        const inCornerQuadrant = Math.abs(pos.x) > (ARENA.HALF_W - CR) && Math.abs(pos.z) > (ARENA.HALF_L - CR);

        if (inCornerQuadrant) {
            const dx = pos.x - cornerCenterX;
            const dz = pos.z - cornerCenterZ;
            const radialXZ = Math.hypot(dx, dz);
            const curveStartRadial = CR - R; // Where flat floor meets curved corner bowl

            if (radialXZ <= curveStartRadial && pos.y <= R) {
                return {
                    normal: new THREE.Vector3(0, 1, 0),
                    signedDist: pos.y - objectRadius,
                    surfaceType: 'TURF'
                };
            }

            const radDirX = radialXZ > 1e-5 ? dx / radialXZ : Math.sign(pos.x || 1) * 0.7071;
            const radDirZ = radialXZ > 1e-5 ? dz / radialXZ : Math.sign(pos.z || 1) * 0.7071;

            if (pos.y < R) {
                // Smoothly curved quarter-pipe corner bowl!
                const tubeCenterR = curveStartRadial;
                const offR = radialXZ - tubeCenterR;
                const offY = pos.y - R;
                const distFromTubeAxis = Math.hypot(offR, offY);
                let normal;
                if (distFromTubeAxis > 1e-5) {
                    normal = new THREE.Vector3(
                        -(offR / distFromTubeAxis) * radDirX,
                        -(offY / distFromTubeAxis),
                        -(offR / distFromTubeAxis) * radDirZ
                    ).normalize();
                } else {
                    normal = new THREE.Vector3(-radDirX, 1, -radDirZ).normalize();
                }
                const signedDist = (R - distFromTubeAxis) - objectRadius;
                return { normal, signedDist, surfaceType: 'CURVED_CORNER' };
            } else {
                // Vertical curved corner wall above y = R
                const normal = new THREE.Vector3(-radDirX, 0, -radDirZ).normalize();
                const signedDist = (CR - radialXZ) - objectRadius;
                return { normal, signedDist, surfaceType: 'CORNER_WALL' };
            }
        }

        // 4. Side Wall Quarter-Pipe Transition (Left/Right Sidelines: |x| > innerX)
        const absX = Math.abs(pos.x);
        const absZ = Math.abs(pos.z);

        // Exclude backboard curved ramp directly in front of the goal opening so ground shots roll cleanly into the goal!
        const checkBackboard = !inGoalOpening && absZ > innerZ;
        const checkSidewall = absX > innerX;

        let bestCandidate = {
            normal: new THREE.Vector3(0, 1, 0),
            signedDist: pos.y - objectRadius,
            surfaceType: 'TURF'
        };

        if (checkSidewall) {
            const signX = Math.sign(pos.x);
            if (pos.y < R) {
                // Quarter-pipe curve centered at (signX * innerX, R)
                const offX = absX - innerX;
                const offY = pos.y - R;
                const dAxis = Math.hypot(offX, offY);
                const normal = dAxis > 1e-5
                    ? new THREE.Vector3(-signX * (offX / dAxis), -(offY / dAxis), 0).normalize()
                    : new THREE.Vector3(-signX, 1, 0).normalize();
                const signedDist = (R - dAxis) - objectRadius;
                if (signedDist < bestCandidate.signedDist) {
                    bestCandidate = { normal, signedDist, surfaceType: 'CURVED_RAMP' };
                }
            } else {
                // Vertical side wall above y = R
                const normal = new THREE.Vector3(-signX, 0, 0);
                const signedDist = (ARENA.HALF_W - absX) - objectRadius;
                if (signedDist < bestCandidate.signedDist) {
                    bestCandidate = { normal, signedDist, surfaceType: 'SIDE_WALL' };
                }
            }
        }

        if (checkBackboard) {
            const signZ = Math.sign(pos.z);
            if (pos.y < R) {
                // Quarter-pipe backboard curve centered at (signZ * innerZ, R)
                const offZ = absZ - innerZ;
                const offY = pos.y - R;
                const dAxis = Math.hypot(offZ, offY);
                const normal = dAxis > 1e-5
                    ? new THREE.Vector3(0, -(offY / dAxis), -signZ * (offZ / dAxis)).normalize()
                    : new THREE.Vector3(0, 1, -signZ).normalize();
                const signedDist = (R - dAxis) - objectRadius;
                if (signedDist < bestCandidate.signedDist) {
                    bestCandidate = { normal, signedDist, surfaceType: 'CURVED_BACKBOARD' };
                }
            } else {
                // Vertical backboard wall above y = R
                const normal = new THREE.Vector3(0, 0, -signZ);
                const signedDist = (ARENA.HALF_L - absZ) - objectRadius;
                if (signedDist < bestCandidate.signedDist) {
                    bestCandidate = { normal, signedDist, surfaceType: 'BACKBOARD' };
                }
            }
        }

        return bestCandidate;
    }

