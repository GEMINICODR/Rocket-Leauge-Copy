            bodyGroup.add(bumper);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.1, 1.15, 3.3), bodyMat);
            cabin.position.set(0, 2.2, 0.55);
            cabin.castShadow = true;
            bodyGroup.add(cabin);

            const windshield = new THREE.Mesh(new THREE.BoxGeometry(2.85, 0.85, 3.38), cabinMat);
            windshield.position.set(0, 2.22, 0.52);
