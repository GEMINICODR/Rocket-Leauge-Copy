    <script>
    /**
     * ROCKET ARENA 3D - Curved Quarter-Pipe Walls & Air-Roll Edition
     * Complete Single-File Three.js Arcade Car Soccer Game
     */

    // ==========================================
    // 1. PROCEDURAL WEB AUDIO SOUND SYSTEM (ZERO EXTERNAL AUDIO URLS)
    // ==========================================
    class SoundManager {
        constructor() {
            this.enabled = true;
            this.ctx = null;
            this.boostGain = null;
            this.isBoostingSound = false;
        }

        async init() {
            if (this.ctx) {
                if (this.ctx.state === 'suspended') {
                    await this.ctx.resume();
                }
                return;
            }
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                this.ctx = new AudioCtx();

                // Continuous filtered noise node for rocket boost thruster
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.04 * white)) / 1.04;
                    lastOut = output[i];
                    output[i] *= 2.8;
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 340;

                this.boostGain = this.ctx.createGain();
                this.boostGain.gain.value = 0.0;

                whiteNoise.connect(filter);
                filter.connect(this.boostGain);
                this.boostGain.connect(this.ctx.destination);
                whiteNoise.start(0);
            } catch (err) {
                console.warn('Web Audio fallback active:', err);
            }
        }

        toggle() {
            this.enabled = !this.enabled;
            if (!this.enabled) this.setBoost(false);
            return this.enabled;
        }

        setBoost(active) {
            if (!this.ctx || !this.boostGain) return;
            const target = (this.enabled && active) ? 0.14 : 0.0;
            this.boostGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.04);
            this.isBoostingSound = active && this.enabled;
        }

        playTone(freqStart, freqEnd, duration, type = 'triangle', volume = 0.16, delay = 0) {
            if (!this.ctx || !this.enabled) return;
            try {
                const now = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, now);
                osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);

                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (e) {}
        }

        playNoiseBurst(duration, cutoff = 900, volume = 0.25) {
            if (!this.ctx || !this.enabled) return;
            try {
                const now = this.ctx.currentTime;
                const len = Math.floor(this.ctx.sampleRate * duration);
                const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(cutoff, now);
                filter.frequency.exponentialRampToValueAtTime(80, now + duration);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(now);
            } catch (e) {}
        }

        playJump(isDouble = false) {
            this.playTone(isDouble ? 240 : 150, isDouble ? 480 : 290, 0.14, 'sine', 0.16);
        }

        playBallHit(intensity = 1) {
            const pitch = intensity > 1.3 ? 130 : 95;
            this.playTone(pitch, 38, 0.2, 'sine', Math.min(0.28, 0.14 * intensity));
        }

        playBoostPad(isBig = false) {
            if (isBig) {
                this.playTone(523.25, 659.25, 0.12, 'triangle', 0.12, 0);
                this.playTone(659.25, 783.99, 0.14, 'triangle', 0.12, 0.06);
                this.playTone(783.99, 1046.5, 0.18, 'triangle', 0.14, 0.12);
            } else {
                this.playTone(587.33, 880, 0.1, 'triangle', 0.1);
            }
        }

        playCountdown(go = false) {
            this.playTone(go ? 784 : 440, go ? 1046.5 : 440, go ? 0.35 : 0.16, 'triangle', 0.16);
        }

        playGoal() {
            this.playNoiseBurst(1.1, 1100, 0.32);
            this.playTone(261.63, 261.63, 0.25, 'sawtooth', 0.12, 0.05);
            this.playTone(329.63, 329.63, 0.25, 'sawtooth', 0.12, 0.15);
            this.playTone(392.00, 392.00, 0.25, 'sawtooth', 0.12, 0.25);
            this.playTone(523.25, 523.25, 0.55, 'sawtooth', 0.16, 0.35);
        }

        playDemo() {
            this.playNoiseBurst(0.85, 750, 0.36);
            this.playTone(110, 28, 0.55, 'sawtooth', 0.26, 0);
        }

        playRespawn() {
            this.playTone(330, 660, 0.18, 'sine', 0.14);
        }
    }

    const sfx = new SoundManager();

    // ==========================================
    // 2. ARENA DIMENSIONS, CURVED QUARTER-PIPES & PHYSICS CONSTANTS
    // ==========================================
    const ARENA = {
        HALF_W: 85,          // Total pitch width = 170 units
        HALF_L: 130,         // Total pitch length = 260 units
        WALL_H: 64,          // Ceiling height = 64 units
        CURVE_R: 15,         // Smooth Rocket League quarter-pipe floor-to-wall curve radius!
        CORNER_R: 26,        // Smooth rounded corner bowl radius!
        GOAL_HALF_W: 19,     // Goal width = 38 units
        GOAL_H: 16,          // Goal crossbar height = 16 units
        GOAL_DEPTH: 18       // Recessed goal depth
    };

    const PHYSICS = {
        GRAVITY: -38,
        BALL_RADIUS: 4.8,
        BALL_RESTITUTION: 0.80,
        BALL_MAX_SPEED: 132,
        CAR_MAX_SPEED: 50,
