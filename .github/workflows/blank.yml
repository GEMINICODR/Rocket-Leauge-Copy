            chassis.position.set(0, 1.0, 0);
            chassis.castShadow = true;
            bodyGroup.add(chassis);

            const hoodScoop = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.35, 2.2), cabinMat);
            hoodScoop.position.set(0, 1.55, -1.6);
            bodyGroup.add(hoodScoop);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.78, 2.5), cabinMat);
            cabin.position.set(0, 1.82, 0.45);
            cabin.castShadow = true;
            bodyGroup.add(cabin);

            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.2, 0.8), bodyMat);
            spoiler.position.set(0, 1.9, 3.1);
            spoiler.rotation.x = -0.25;
            bodyGroup.add(spoiler);

            const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.06, 6.5), accentMat);
