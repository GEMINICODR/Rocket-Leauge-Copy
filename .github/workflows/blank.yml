    function spawnGoalExplosion(originPos, scoringTeam) {
        const palette = scoringTeam === 'blue'
            ? [0x3b82f6, 0x38bdf8, 0x60a5fa, 0xffffff]
            : [0xf97316, 0xfacc15, 0xfb923c, 0xffffff];

        for (let i = 0; i < 110; i++) {
            const mat = new THREE.MeshBasicMaterial({
                color: palette[i % palette.length],
                transparent: true,
                opacity: 1
            });
            const mesh = new THREE.Mesh(particleGeo, mat);
            mesh.position.copy(originPos);
            scene.add(mesh);

            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const speed = 22 + Math.random() * 58;

            particles.push({
                mesh,
                vel: new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * speed,
                    Math.abs(Math.cos(phi)) * speed + 10,
                    Math.sin(phi) * Math.sin(theta) * speed
                ),
                life: 1.4 + Math.random() * 0.7,
                maxLife: 2.1,
                scale: 2.0 + Math.random() * 1.7
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt;
            if (p.life <= 0) {
                scene.remove(p.mesh);
                p.mesh.material.dispose();
                particles.splice(i, 1);
                continue;
            }
            p.mesh.position.addScaledVector(p.vel, dt);
            const ratio = p.life / p.maxLife;
            p.mesh.material.opacity = ratio;
            const s = p.scale * ratio;
            p.mesh.scale.set(s, s, s);
        }
    }

    function updateShockwaves(dt) {
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            const sw = shockwaves[i];
            sw.life -= dt;
            if (sw.life <= 0) {
                scene.remove(sw.mesh);
                sw.mesh.geometry.dispose();
                sw.mesh.material.dispose();
                shockwaves.splice(i, 1);
                continue;
            }
            const progress = 1 - sw.life / sw.maxLife;
            const scale = 1 + progress * 9.5;
            sw.mesh.scale.set(scale, scale, 1);
            sw.mesh.material.opacity = (1 - progress) * 0.9;
        }
    }

    // ==========================================
    // 11. VARIED KICKOFF & SMART AI CONTROLLER
    // ==========================================
    const KICKOFF_STRATEGIES = ['BOOST_RUSH', 'DELAYED_CHEAT', 'DIAGONAL_WIDE', 'GOALIE_DEFEND'];
    let currentKickoffStrategy = 'BOOST_RUSH';
    let kickoffPhaseTimer = 0;
    let kickoffActive = false;
    let kickoffSideSign = 1;

    function assignNewKickoffStrategy() {
        currentKickoffStrategy = KICKOFF_STRATEGIES[Math.floor(Math.random() * KICKOFF_STRATEGIES.length)];
        kickoffPhaseTimer = 0;
        kickoffActive = true;
        kickoffSideSign = Math.random() < 0.5 ? -1 : 1;
    }

    function computeAIControls(aiCar, ball, difficulty, dt) {
        const diffSettings = {
            rookie:  { throttleScale: 0.85, boostThresh: 0.86, predictTime: 0.22, skillAim: 0.78, demoAggro: 0.04 },
            pro:     { throttleScale: 0.96, boostThresh: 0.72, predictTime: 0.38, skillAim: 0.90, demoAggro: 0.18 },
            allstar: { throttleScale: 1.00, boostThresh: 0.55, predictTime: 0.54, skillAim: 1.00, demoAggro: 0.36 }
        }[difficulty] || { throttleScale: 0.96, boostThresh: 0.72, predictTime: 0.38, skillAim: 0.90, demoAggro: 0.18 };

        const blueGoalPos = new THREE.Vector3(0, 0, ARENA.HALF_L);
        const orangeGoalPos = new THREE.Vector3(0, 0, -ARENA.HALF_L);

        // --- KICKOFF PHASE LOGIC ---
        if (kickoffActive) {
            kickoffPhaseTimer += dt;
            const ballMoved = ball.pos.length() > 8.5 || ball.vel.length() > 8;
            if (ballMoved || kickoffPhaseTimer > 2.8) {
                kickoffActive = false;
            } else {
                let kTarget = new THREE.Vector3(0, 0, 0);
                let kThrottle = 1.0;
                let kBoost = true;
                let kFlipOnImpact = true;

                if (currentKickoffStrategy === 'BOOST_RUSH') {
                    kTarget.set(kickoffSideSign * 1.5, 0, 2);
                } else if (currentKickoffStrategy === 'DELAYED_CHEAT') {
                    if (kickoffPhaseTimer < 0.45) {
                        kTarget.set(0, 0, -45);
                        kThrottle = 0.45;
                        kBoost = false;
                    } else {
                        kTarget.set(0, 0, 4);
                    }
                } else if (currentKickoffStrategy === 'DIAGONAL_WIDE') {
                    if (kickoffPhaseTimer < 0.95) {
                        kTarget.set(kickoffSideSign * 30, 0, -28);
                    } else {
                        kTarget.set(-kickoffSideSign * 2, 0, 3);
                    }
                } else if (currentKickoffStrategy === 'GOALIE_DEFEND') {
                    kTarget.set(kickoffSideSign * 4, 0, -ARENA.HALF_L + 10);
                    kThrottle = aiCar.pos.z < -ARENA.HALF_L + 16 ? -0.35 : 0.7;
                    kBoost = false;
                    kFlipOnImpact = false;
                }

                const toK = kTarget.sub(aiCar.pos);
                toK.y = 0;
                const distK = toK.length();
                if (distK > 0.1) toK.normalize();

                const fVec = aiCar.getForwardVector();
                const rVec = aiCar.getRightVector();
                const fDot = fVec.dot(toK);
                const rDot = rVec.dot(toK);

                if (currentKickoffStrategy === 'GOALIE_DEFEND' && aiCar.pos.z < -ARENA.HALF_L + 18) {
                    const toBall = ball.pos.clone().sub(aiCar.pos).normalize();
                    const alignRight = rVec.dot(toBall);
                    return {
                        throttle: 0,
                        steer: THREE.MathUtils.clamp(alignRight * 3.0, -1, 1),
                        boost: false,
                        drift: true,
                        airRoll: 0
                    };
                }

                if (kFlipOnImpact && aiCar.pos.distanceTo(ball.pos) < 12.5 && fDot > 0.85 && aiCar.grounded) {
                    aiCar.triggerJump(1, 0);
                    setTimeout(() => {
                        if (!aiCar.grounded && aiCar.jumpCount === 1 && !aiCar.isDemolished) {
                            aiCar.triggerJump(1, 0);
                        }
                    }, 130);
                }

                return {
                    throttle: kThrottle,
                    steer: THREE.MathUtils.clamp(rDot * 2.5, -1, 1),
                    boost: kBoost && fDot > 0.7 && aiCar.boost > 8,
                    drift: Math.abs(rDot) > 0.68 && distK > 12,
                    airRoll: 0
                };
            }
        }

        // --- OPEN PLAY AI LOGIC ---
        const predictedBall = ball.pos.clone().addScaledVector(ball.vel, diffSettings.predictTime);
        const ballToBlueGoal = blueGoalPos.clone().sub(predictedBall).normalize();
        const isDanger = ball.pos.z < -35 && ball.vel.z < 8;
        let targetPoint;

        const canHuntDemo = !playerCar.isDemolished && diffSettings.demoAggro > 0 &&
                            aiCar.boost > 35 && aiCar.pos.distanceTo(playerCar.pos) < 42 && ball.pos.z > -20;

        if (playerCar.isDemolished) {
            const offsetDist = Math.min(predictedBall.distanceTo(aiCar.pos) * 0.25, 7);
            targetPoint = predictedBall.clone().addScaledVector(ballToBlueGoal, -offsetDist);
        } else if (isDanger) {
            const toOrange = orangeGoalPos.clone().sub(predictedBall).normalize();
            targetPoint = predictedBall.clone().addScaledVector(toOrange, 5.5);
        } else if (canHuntDemo && Math.sin(performance.now() * 0.001) > (1 - diffSettings.demoAggro * 2)) {
            targetPoint = playerCar.pos.clone().addScaledVector(playerCar.vel, 0.22);
        } else {
            const offsetDist = Math.min(predictedBall.distanceTo(aiCar.pos) * 0.35, 11) * diffSettings.skillAim;
            targetPoint = predictedBall.clone().addScaledVector(ballToBlueGoal, -offsetDist);
        }

        if (aiCar.boost < 28 && !isDanger) {
            let bestPad = null;
            let bestDist = 48;
            for (const p of boostPads) {
                if (p.active && p.big) {
                    const d = aiCar.pos.distanceTo(p.pos);
                    if (d < bestDist) {
                        bestDist = d;
                        bestPad = p;
                    }
                }
            }
            if (bestPad) targetPoint = bestPad.pos.clone();
        }

        const toTarget = targetPoint.sub(aiCar.pos);
        // Project target direction onto the car's current driving surface plane
        toTarget.addScaledVector(aiCar.surfaceNormal, -toTarget.dot(aiCar.surfaceNormal));
        const distToTarget = toTarget.length();
        if (distToTarget > 0.05) toTarget.normalize();

        const forward = aiCar.getForwardVector();
        const right = aiCar.getRightVector();

        const forwardDot = forward.dot(toTarget);
        const rightDot = right.dot(toTarget);

        const steer = THREE.MathUtils.clamp(rightDot * 2.4, -1, 1);
        const throttle = forwardDot > -0.2 ? diffSettings.throttleScale : -0.68;
        const boostThreshEffective = (playerCar.isDemolished || isDanger) ? 0.45 : diffSettings.boostThresh;
        const boost = forwardDot > boostThreshEffective && distToTarget > 16 && aiCar.boost > 10;
        const drift = Math.abs(rightDot) > 0.72 && distToTarget > 15;

        const distToBall = aiCar.pos.distanceTo(ball.pos);
        if (distToBall < 10.5 && ball.pos.y < 8.5 && forwardDot > 0.84 && aiCar.grounded) {
            aiCar.triggerJump(1, 0);
            setTimeout(() => {
                if (!aiCar.grounded && aiCar.jumpCount === 1 && !aiCar.isDemolished) {
                    aiCar.triggerJump(1, 0);
                }
            }, 140);
        }

        // If airborne, AI gently levels its roof upward for a clean 4-wheel landing
        let aiAirRoll = 0;
        if (!aiCar.grounded) {
            const up = aiCar.getUpVector();
            if (up.y < 0.85) {
                aiAirRoll = right.y > 0 ? -0.8 : 0.8;
            }
        }

        return { throttle, steer, boost, drift, airRoll: aiAirRoll };
    }

    // ==========================================
    // 12. COLLISION RESOLUTION (BALL, BOOST & DEMOLITION)
    // ==========================================
    function triggerDemolition(attacker, victim, stats) {
        const boomPos = victim.pos.clone();
        victim.demolish();
        spawnDemoExplosion(boomPos);
        sfx.playDemo();
        cameraShake = 2.4;

        if (attacker.isPlayer) {
            stats.demos++;
            document.getElementById('hud-demos-count').textContent = stats.demos;
            demoBannerTimer = 3.0;
            demoBannerType = 'PLAYER_DEMOED_AI';
            showBanner('BOOM! DEMOLITION!', 'DEMOLISHED!', 'Opponent respawning in 3.0s...', 'text-orange-400 animate-banner');
        } else {
            demoBannerTimer = 3.0;
            demoBannerType = 'AI_DEMOED_PLAYER';
            showBanner('BOOM! YOU WERE DEMOED!', 'DEMOLISHED!', 'Respawning in 3.0s...', 'text-rose-500 animate-banner');
        }
    }

    function resolveCollisions(player, ai, ball, stats) {
        const activeCars = [player, ai].filter(c => !c.isDemolished);

        activeCars.forEach(car => {
            const up = car.getUpVector();
            const carCenter = car.pos.clone().addScaledVector(up, 1.5);
            const diff = ball.pos.clone().sub(carCenter);
            const dist = diff.length();
            const minDist = car.radius + PHYSICS.BALL_RADIUS;

            if (dist < minDist && dist > 0.001) {
                const normal = diff.clone().divideScalar(dist);
                ball.pos.copy(carCenter).addScaledVector(normal, minDist + 0.06);

                const relVel = car.vel.clone().sub(ball.vel);
                const closingSpeed = Math.max(14, relVel.dot(normal));
                const hitPower = (closingSpeed * 1.52 + (car.flipTimer > 0 ? 20 : 0)) * car.preset.powerMult;

                ball.vel.addScaledVector(normal, hitPower);
                ball.vel.y += 4.5 + Math.max(0, car.vel.y * 0.42);

                if (car.isPlayer) {
                    stats.touches++;
                    if (ball.pos.z > 55) stats.clears++;
                    sfx.playBallHit(hitPower / 34);
                    cameraShake = Math.min(1.5, hitPower / 46);
                }
            }

            // Boost Pad Pickups
            for (const pad of boostPads) {
                if (!pad.active) continue;
                const dx = car.pos.x - pad.pos.x;
                const dz = car.pos.z - pad.pos.z;
                if (dx * dx + dz * dz < pad.radius * pad.radius && car.pos.y < 6.0 && car.boost < 99.5) {
                    pad.active = false;
                    pad.cooldown = pad.respawnTime;
                    pad.orbMesh.visible = false;
                    car.boost = Math.min(100, car.boost + pad.amount);
                    if (car.isPlayer) {
                        stats.padsCollected++;
                        sfx.playBoostPad(pad.big);
                    }
                }
            }
        });

        // Car vs Car Bump OR Supersonic Demolition
        if (!player.isDemolished && !ai.isDemolished) {
            const carDiff = ai.pos.clone().sub(player.pos);
            const carDist = carDiff.length();
            const minCarDist = Math.max(player.radius + ai.radius, 4.6);

            if (carDist < minCarDist && carDist > 0.001) {
                const n = carDiff.clone().divideScalar(carDist);
                const playerSpeed = player.vel.length();
                const aiSpeed = ai.vel.length();

                const playerForward = player.getForwardVector();
                const aiForward = ai.getForwardVector();

                const playerClosing = player.supersonic && playerForward.dot(n) > 0.35;
                const aiClosing = ai.supersonic && aiForward.dot(n.clone().negate()) > 0.35;

                if (playerClosing && !aiClosing) {
                    triggerDemolition(player, ai, stats);
                    return;
                } else if (aiClosing && !playerClosing) {
                    triggerDemolition(ai, player, stats);
                    return;
                } else if (playerClosing && aiClosing) {
                    if (playerSpeed - aiSpeed > 3.0) {
                        triggerDemolition(player, ai, stats);
                        return;
                    } else if (aiSpeed - playerSpeed > 3.0) {
                        triggerDemolition(ai, player, stats);
                        return;
                    }
                }

                const overlap = minCarDist - carDist;
                player.pos.addScaledVector(n, -overlap * 0.5);
                ai.pos.addScaledVector(n, overlap * 0.5);

                const tempVel = player.vel.clone();
                player.vel.lerp(ai.vel, 0.65);
                ai.vel.lerp(tempVel, 0.65);
            }
        }
    }

    // ==========================================
    // 13. DYNAMIC BALL-CAM & FOLLOW-CAM (WALL-AWARE)
    // ==========================================
    let ballCamEnabled = true;
    let cameraShake = 0;

    function updateCamera(dt, player, ball) {
        const camTargetPos = new THREE.Vector3();
        const lookTarget = new THREE.Vector3();

        if (ballCamEnabled) {
            const focusPos = player.isDemolished
                ? ball.pos.clone().add(new THREE.Vector3(0, 7, 28))
                : player.pos;

            const ballToCar = focusPos.clone().sub(ball.pos);
            ballToCar.y = 0;
            if (ballToCar.lengthSq() < 0.01) {
                ballToCar.set(0, 0, 1);
            }
            ballToCar.normalize();

            // Pull camera slightly inward along the wall normal when driving high on walls
            const wallPullIn = player.grounded ? player.surfaceNormal.clone().multiplyScalar(5.5) : new THREE.Vector3(0, 6.2, 0);

            camTargetPos.copy(focusPos)
                .addScaledVector(ballToCar, 16.5)
                .add(wallPullIn)
                .add(new THREE.Vector3(0, 2.5, 0));

            lookTarget.copy(ball.pos).lerp(focusPos, 0.24);
            lookTarget.y = Math.max(2.5, ball.pos.y * 0.78);
        } else {
            const forward = player.getForwardVector();
            const up = player.getUpVector();
            camTargetPos.copy(player.pos)
                .addScaledVector(forward, -15.5)
                .addScaledVector(up, 5.5)
                .add(new THREE.Vector3(0, 1.5, 0));

            lookTarget.copy(player.pos)
                .addScaledVector(forward, 14)
                .addScaledVector(up, 1.8);
        }

        // Keep camera cleanly inside the arena walls
        camTargetPos.x = THREE.MathUtils.clamp(camTargetPos.x, -ARENA.HALF_W + 4.5, ARENA.HALF_W - 4.5);
        camTargetPos.z = THREE.MathUtils.clamp(camTargetPos.z, -ARENA.HALF_L + 4.5, ARENA.HALF_L + 10);
        camTargetPos.y = THREE.MathUtils.clamp(camTargetPos.y, 3.0, ARENA.WALL_H - 3.0);

        camera.position.lerp(camTargetPos, 1 - Math.exp(-9.5 * dt));

        if (cameraShake > 0.01) {
            camera.position.x += (Math.random() - 0.5) * cameraShake;
            camera.position.y += (Math.random() - 0.5) * cameraShake;
            cameraShake *= Math.pow(0.04, dt);
        }

        camera.lookAt(lookTarget);
    }

    // ==========================================
    // 14. INPUT HANDLING (KEYBOARD, MOUSE, AIR ROLL & TOUCH)
    // ==========================================
    const keys = {};
    let rightMouseBoost = false;

    window.addEventListener('keydown', e => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
            e.preventDefault();
        }
        if (!keys[e.code]) {
            if (e.code === 'Space' && gameState === 'PLAYING' && !playerCar.isDemolished) {
                const { throttle, steer } = getPlayerInput();
                playerCar.triggerJump(throttle, steer);
            }
            if (e.code === 'KeyC') {
                toggleBallCam();
            }
        }
        keys[e.code] = true;
    });

    window.addEventListener('keyup', e => {
        keys[e.code] = false;
    });

    window.addEventListener('mousedown', e => {
        if (e.button === 2) rightMouseBoost = true;
    });
    window.addEventListener('mouseup', e => {
        if (e.button === 2) rightMouseBoost = false;
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    document.querySelectorAll('.touch-btn').forEach(btn => {
        const keyCode = btn.getAttribute('data-key');
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            btn.classList.add('active');
            if (!keys[keyCode] && keyCode === 'Space' && gameState === 'PLAYING' && !playerCar.isDemolished) {
                const { throttle, steer } = getPlayerInput();
                playerCar.triggerJump(throttle, steer);
            }
            keys[keyCode] = true;
        }, { passive: false });

        btn.addEventListener('touchend', e => {
            e.preventDefault();
            btn.classList.remove('active');
            keys[keyCode] = false;
        }, { passive: false });
    });

    function getPlayerInput() {
        const forward = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
        const backward = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
        const left = (keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0;
        const right = (keys['KeyD'] || keys['ArrowRight']) ? 1 : 0;
        const freeRollMod = Boolean(keys['ControlLeft'] || keys['ControlRight']);

        // Dedicated Air Roll Left (Q) / Air Roll Right (E), PLUS Free Air Roll modifier (Ctrl + Left/Right)
        let airRoll = 0;
        if (keys['KeyQ']) airRoll -= 1;
        if (keys['KeyE']) airRoll += 1;
        if (freeRollMod && !playerCar.grounded) {
            airRoll += (right - left);
        }
        airRoll = THREE.MathUtils.clamp(airRoll, -1, 1);

        // If Free Air Roll modifier is held in mid-air, A/D controls Roll instead of Yaw
        const yawSteer = (!playerCar.grounded && freeRollMod) ? 0 : (right - left);

        return {
            throttle: forward - backward,
            steer: yawSteer,
            airRoll,
            boost: Boolean(keys['ShiftLeft'] || keys['ShiftRight'] || rightMouseBoost),
            drift: Boolean(keys['ControlLeft'] || keys['ControlRight'])
        };
    }

    // ==========================================
    // 15. GARAGE MENU WIRING & MATCH LOOP
    // ==========================================
    const playerCar = new Car('blue', true, 'octane');
    const aiCar = new Car('orange', false, 'dominus');
    const ball = new SoccerBall();

    let gameState = 'START';
    let difficulty = 'pro';
    let matchDuration = 180;
    let timeRemaining = 180;
    let isOvertime = false;
    let scoreBlue = 0;
    let scoreOrange = 0;
    let stateTimer = 0;
    let lastCountdownInt = 4;
    let demoBannerTimer = 0;
    let demoBannerType = null;

    const matchStats = {
        touches: 0,
        clears: 0,
        demos: 0,
        padsCollected: 0
    };

    function updateGarageUI() {
        const preset = CAR_PRESETS[selectedCarId];
        document.getElementById('garage-selected-tag').textContent = preset.name;
        document.getElementById('hud-player-car-name').textContent = preset.name;

        document.getElementById('stat-val-speed').textContent = preset.stats.speed;
        document.getElementById('stat-bar-speed').style.width = preset.stats.speed + '%';

        document.getElementById('stat-val-boost').textContent = preset.stats.boost;
        document.getElementById('stat-bar-boost').style.width = preset.stats.boost + '%';

        document.getElementById('stat-val-agility').textContent = preset.stats.agility;
        document.getElementById('stat-bar-agility').style.width = preset.stats.agility + '%';

        playerCar.setLoadout(selectedCarId, selectedPrimaryHex, selectedAccentHex);
        rebuildShowroomCar();
    }

    document.querySelectorAll('#car-cards-grid .car-card').forEach(card => {
        card.addEventListener('click', () => {
            document.querySelectorAll('#car-cards-grid .car-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedCarId = card.getAttribute('data-car');
            updateGarageUI();
        });
    });

    document.querySelectorAll('#paint-swatches .swatch-btn').forEach(swatch => {
        swatch.addEventListener('click', () => {
            document.querySelectorAll('#paint-swatches .swatch-btn').forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
            selectedPrimaryHex = parseInt(swatch.getAttribute('data-primary').replace('#', '0x'), 16);
            selectedAccentHex = parseInt(swatch.getAttribute('data-accent').replace('#', '0x'), 16);
            updateGarageUI();
        });
    });

    const startScreenEl = document.getElementById('start-screen');
    const endScreenEl = document.getElementById('end-screen');
    const hudEl = document.getElementById('hud');
    const scoreBlueEl = document.getElementById('score-blue');
    const scoreOrangeEl = document.getElementById('score-orange');
    const timerEl = document.getElementById('match-timer');
    const statusTagEl = document.getElementById('match-status-tag');
    const centerBannerEl = document.getElementById('center-banner');
    const bannerSubtitleEl = document.getElementById('banner-subtitle');
    const bannerTitleEl = document.getElementById('banner-title');
    const bannerDetailEl = document.getElementById('banner-detail');
    const boostValueEl = document.getElementById('boost-value');
    const boostArcEl = document.getElementById('boost-arc');
    const speedReadoutEl = document.getElementById('speed-readout');
    const supersonicBadgeEl = document.getElementById('supersonic-badge');
    const airborneHudEl = document.getElementById('airborne-hud');
    const surfaceStatusPillEl = document.getElementById('surface-status-pill');

    function formatClock(seconds) {
        const s = Math.max(0, Math.ceil(seconds));
        const mins = Math.floor(s / 60);
        const secs = s % 60;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function showBanner(subtitle, title, detail = '', titleColorClass = 'text-white') {
        bannerSubtitleEl.textContent = subtitle;
        bannerTitleEl.textContent = title;
        bannerTitleEl.className = `font-orbitron text-3xl sm:text-5xl font-black tracking-tight drop-shadow-[0_4px_20px_rgba(255,255,255,0.4)] ${titleColorClass}`;
        bannerDetailEl.textContent = detail;
        centerBannerEl.classList.remove('hidden');
    }

    function hideBanner() {
        centerBannerEl.classList.add('hidden');
    }

    function toggleBallCam() {
        ballCamEnabled = !ballCamEnabled;
        document.getElementById('cam-mode-text').textContent = ballCamEnabled ? 'ON' : 'OFF';
    }

    document.getElementById('btn-cam-toggle').addEventListener('click', toggleBallCam);
    document.getElementById('btn-sound-toggle').addEventListener('click', () => {
        const enabled = sfx.toggle();
        document.getElementById('sound-mode-text').textContent = enabled ? 'ON' : 'OFF';
    });

    function resetKickoffPositions() {
        playerCar.reset();
        aiCar.reset();
        ball.reset();
        assignNewKickoffStrategy();
        demoBannerTimer = 0;
        demoBannerType = null;
        boostPads.forEach(p => {
            p.active = true;
            p.cooldown = 0;
            p.orbMesh.visible = true;
        });
    }

    function beginCountdown() {
        resetKickoffPositions();
        gameState = 'COUNTDOWN';
        stateTimer = 3.0;
        lastCountdownInt = 4;
        sfx.setBoost(false);
    }

    async function startNewMatch() {
        await sfx.init();
        difficulty = document.getElementById('select-difficulty').value;
        matchDuration = parseInt(document.getElementById('select-duration').value, 10);

        const aiModels = ['octane', 'dominus', 'fennec', 'breakout'];
        const chosenAiModel = aiModels[Math.floor(Math.random() * aiModels.length)];
        aiCar.setLoadout(chosenAiModel, 0xea580c, 0xfacc15);
        document.getElementById('hud-ai-car-name').textContent = CAR_PRESETS[chosenAiModel].name;

        playerCar.setLoadout(selectedCarId, selectedPrimaryHex, selectedAccentHex);
        if (showroomCarMesh) showroomCarMesh.root.visible = false;

        timeRemaining = matchDuration;
        isOvertime = false;
        scoreBlue = 0;
        scoreOrange = 0;

        matchStats.touches = 0;
        matchStats.clears = 0;
        matchStats.demos = 0;
        matchStats.padsCollected = 0;

        scoreBlueEl.textContent = '0';
        scoreOrangeEl.textContent = '0';
        document.getElementById('hud-demos-count').textContent = '0';
        statusTagEl.textContent = 'REGULATION';
        statusTagEl.className = 'text-[10px] uppercase tracking-widest text-emerald-400 font-bold';
        timerEl.textContent = formatClock(timeRemaining);

        startScreenEl.classList.add('hidden');
        endScreenEl.classList.add('hidden');
        hudEl.classList.remove('hidden');

        beginCountdown();
    }

    function handleGoalScored(scoringTeam) {
        gameState = 'GOAL_CELEBRATION';
        stateTimer = 3.2;
        sfx.setBoost(false);
        sfx.playGoal();
        cameraShake = 2.8;
        demoBannerTimer = 0;
        demoBannerType = null;

        spawnGoalExplosion(ball.pos.clone(), scoringTeam);

        if (scoringTeam === 'blue') {
            scoreBlue++;
            scoreBlueEl.textContent = scoreBlue;
            showBanner('BLUE TEAM SCORES!', 'GOAL!!', 'WHAT A STRIKE!', 'text-blue-400 animate-banner');
        } else {
            scoreOrange++;
            scoreOrangeEl.textContent = scoreOrange;
            showBanner('ORANGE TEAM SCORES!', 'GOAL!!', 'AI FINDS THE NET!', 'text-orange-400 animate-banner');
        }

        if (isOvertime) {
            setTimeout(() => endMatch(), 2600);
        }
    }

    function endMatch() {
        gameState = 'ENDED';
        sfx.setBoost(false);
        hideBanner();
        hudEl.classList.add('hidden');
        endScreenEl.classList.remove('hidden');

        document.getElementById('final-score-blue').textContent = scoreBlue;
        document.getElementById('final-score-orange').textContent = scoreOrange;
        document.getElementById('stat-shots').textContent = matchStats.touches;
        document.getElementById('stat-saves').textContent = matchStats.clears;
        document.getElementById('stat-demos').textContent = matchStats.demos;
        document.getElementById('stat-boosts').textContent = matchStats.padsCollected;

        const titleEl = document.getElementById('end-result-title');
        const subEl = document.getElementById('end-result-subtitle');
        const badgeEl = document.getElementById('end-result-badge');

        if (scoreBlue > scoreOrange) {
            titleEl.textContent = 'VICTORY!';
            titleEl.className = 'font-orbitron text-4xl sm:text-5xl font-black text-blue-400 mb-2';
            subEl.textContent = 'Blue Team rules Rocket Arena!';
            badgeEl.textContent = 'CHAMPION';
        } else {
            titleEl.textContent = 'DEFEAT';
            titleEl.className = 'font-orbitron text-4xl sm:text-5xl font-black text-orange-400 mb-2';
            subEl.textContent = 'Orange AI took the trophy. Ready for a rematch?';
            badgeEl.textContent = 'FINAL BUZZER';
        }
    }

    function updateHUD() {
        const bVal = Math.round(playerCar.boost);
        boostValueEl.textContent = bVal;
        const circumference = 263.89;
        boostArcEl.style.strokeDashoffset = circumference * (1 - bVal / 100);

        const speedKmh = Math.round(playerCar.vel.length() * 2.1);
        speedReadoutEl.textContent = speedKmh;
        supersonicBadgeEl.style.opacity = (!playerCar.isDemolished && playerCar.supersonic) ? '1' : '0';

        // Airborne Air-Roll HUD & Surface Grip Pill
        if (!playerCar.isDemolished && !playerCar.grounded) {
            airborneHudEl.style.opacity = '1';
            surfaceStatusPillEl.textContent = playerCar.isAirRolling ? '🌀 AIR ROLLING' : '✈️ AIRBORNE';
            surfaceStatusPillEl.className = 'hud-glass text-xs font-orbitron font-bold tracking-wider px-3 py-1 rounded-full text-cyan-300 border border-cyan-400/40';
        } else {
            airborneHudEl.style.opacity = '0';
            if (playerCar.surfaceType.includes('WALL') || playerCar.surfaceType.includes('BACKBOARD')) {
                surfaceStatusPillEl.textContent = '🧗 WALL DRIVING';
                surfaceStatusPillEl.className = 'hud-glass text-xs font-orbitron font-bold tracking-wider px-3 py-1 rounded-full text-amber-300 border border-amber-400/40';
            } else if (playerCar.surfaceType.includes('CURVED')) {
                surfaceStatusPillEl.textContent = '📐 CURVED RAMP';
                surfaceStatusPillEl.className = 'hud-glass text-xs font-orbitron font-bold tracking-wider px-3 py-1 rounded-full text-sky-300 border border-sky-400/40';
            } else {
                surfaceStatusPillEl.textContent = '🌱 TURF GRIP';
                surfaceStatusPillEl.className = 'hud-glass text-xs font-orbitron font-bold tracking-wider px-3 py-1 rounded-full text-emerald-300 border border-emerald-500/30';
            }
        }
    }

    document.getElementById('btn-start-match').addEventListener('click', startNewMatch);
    document.getElementById('btn-play-again').addEventListener('click', startNewMatch);
    document.getElementById('btn-main-menu').addEventListener('click', () => {
        endScreenEl.classList.add('hidden');
        hudEl.classList.add('hidden');
        startScreenEl.classList.remove('hidden');
        gameState = 'START';
        if (showroomCarMesh) showroomCarMesh.root.visible = true;
    });

    // ==========================================
    // 16. MAIN ANIMATION LOOP
    // ==========================================
    let lastFrameTime = performance.now();

    function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        if (gameState === 'START') {
            if (showroomCarMesh) {
                showroomCarMesh.root.visible = true;
                showroomCarMesh.root.rotation.y += dt * 0.75;
            }
            const t = now * 0.00022;
            camera.position.set(-22 + Math.sin(t) * 18, 8.5, 18 + Math.cos(t) * 18);
            camera.lookAt(-22, 2.5, 18);
            updateBoostPads(dt);
        } else if (gameState === 'COUNTDOWN') {
            stateTimer -= dt;
            const ceilSec = Math.ceil(stateTimer);
            if (ceilSec < lastCountdownInt && ceilSec > 0) {
                lastCountdownInt = ceilSec;
                showBanner('KICKOFF IN', String(ceilSec), 'Drive up curved walls & Air Roll with Q / E!', 'text-white');
                sfx.playCountdown(false);
            }
            if (stateTimer <= 0) {
                gameState = 'PLAYING';
                showBanner('MATCH LIVE', 'GO!!', '', 'text-emerald-400');
                sfx.playCountdown(true);
                setTimeout(() => {
                    if (gameState === 'PLAYING' && demoBannerTimer <= 0) hideBanner();
                }, 650);
            }
            updateBoostPads(dt);
            updateCamera(dt, playerCar, ball);
            updateHUD();
        } else if (gameState === 'PLAYING') {
            if (!isOvertime) {
                timeRemaining -= dt;
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    if (scoreBlue === scoreOrange) {
                        isOvertime = true;
                        statusTagEl.textContent = 'OVERTIME • NEXT GOAL WINS';
                        statusTagEl.className = 'text-[10px] uppercase tracking-widest text-amber-400 font-bold';
                        showBanner('TIED AT ZERO!', 'OVERTIME!', 'Next Goal Wins!', 'text-amber-400 animate-banner');
                        setTimeout(() => {
                            if (gameState === 'PLAYING' && demoBannerTimer <= 0) hideBanner();
                        }, 1600);
                    } else {
                        endMatch();
                    }
                }
                timerEl.textContent = formatClock(timeRemaining);
            } else {
                timeRemaining += dt;
                timerEl.textContent = '+' + formatClock(timeRemaining);
            }

            if (playerCar.isDemolished) {
                sfx.setBoost(false);
                playerCar.respawnTimer -= dt;
                if (playerCar.respawnTimer <= 0) {
                    playerCar.respawnInBackCorner(ball.pos, aiCar.pos);
                }
            } else {
                const pControls = getPlayerInput();
                playerCar.update(dt, pControls);
                sfx.setBoost(playerCar.isBoosting);
            }

            if (aiCar.isDemolished) {
                aiCar.respawnTimer -= dt;
                if (aiCar.respawnTimer <= 0) {
                    aiCar.respawnInBackCorner(ball.pos, playerCar.pos);
                }
            } else {
                const aiControls = computeAIControls(aiCar, ball, difficulty, dt);
                aiCar.update(dt, aiControls);
            }

            if (demoBannerTimer > 0) {
                demoBannerTimer -= dt;
                if (demoBannerTimer <= 0) {
                    demoBannerTimer = 0;
                    demoBannerType = null;
                    hideBanner();
                } else {
                    const secsLeft = Math.max(0.1, demoBannerTimer).toFixed(1);
                    if (demoBannerType === 'AI_DEMOED_PLAYER') {
                        bannerDetailEl.textContent = `Respawning in ${secsLeft}s...`;
                    } else if (demoBannerType === 'PLAYER_DEMOED_AI') {
                        bannerDetailEl.textContent = `Opponent respawning in ${secsLeft}s...`;
                    }
                }
            }

            const goalTeam = ball.update(dt);
            if (goalTeam) {
                handleGoalScored(goalTeam);
            }

            resolveCollisions(playerCar, aiCar, ball, matchStats);
            updateBoostPads(dt);
            updateParticles(dt);
            updateShockwaves(dt);
            updateCamera(dt, playerCar, ball);
            updateHUD();
        } else if (gameState === 'GOAL_CELEBRATION') {
            stateTimer -= dt;
            if (!playerCar.isDemolished) {
                playerCar.update(dt * 0.45, { throttle: 0.3, steer: 0.4, airRoll: 0.8, boost: false, drift: true });
            }
            if (!aiCar.isDemolished) {
                aiCar.update(dt * 0.45, { throttle: 0, steer: 0, airRoll: 0, boost: false, drift: false });
            }
            updateParticles(dt);
            updateShockwaves(dt);
            updateCamera(dt, playerCar, ball);

            if (stateTimer <= 0 && !isOvertime) {
                beginCountdown();
            }
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = function () {
        rebuildShowroomCar();
        lastFrameTime = performance.now();
        requestAnimationFrame(animate);
    };
    </script>
</body>
</html>
