    function createCarMesh(primaryHex, accentHex, modelType = 'octane') {
        const carRoot = new THREE.Group();
        const bodyGroup = new THREE.Group();
        carRoot.add(bodyGroup);

        const bodyMat = new THREE.MeshStandardMaterial({
            color: primaryHex,
            roughness: 0.24,
            metalness: 0.68
        });
        const cabinMat = new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            roughness: 0.1,
            metalness: 0.9
        });
        const accentMat = new THREE.MeshBasicMaterial({ color: accentHex });

        buildCarBodyGeometry(bodyGroup, modelType, bodyMat, cabinMat, accentMat);

        // Dual Rocket Thruster Nozzles + Flame Cones
        const thrusterGeo = new THREE.CylinderGeometry(0.38, 0.48, 0.7, 12);
        const flameGeo = new THREE.ConeGeometry(0.42, 2.4, 12);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0.9 });
        const flames = [];

        [-0.78, 0.78].forEach(tx => {
            const nozzle = new THREE.Mesh(thrusterGeo, cabinMat);
            nozzle.rotation.x = Math.PI / 2;
            nozzle.position.set(tx, 1.25, 3.05);
            bodyGroup.add(nozzle);

            const flame = new THREE.Mesh(flameGeo, flameMat);
            flame.rotation.x = Math.PI / 2;
            flame.position.set(tx, 1.25, 4.35);
            flame.visible = false;
            bodyGroup.add(flame);
            flames.push(flame);
        });

        // Glowing Under-chassis Neon Trim
        const underGlow = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.15, 5.8), accentMat);
        underGlow.position.y = 0.62;
        bodyGroup.add(underGlow);

        // Supersonic Wind-Tunnel Ring & Speed Streaks around Nose
        const sonicGroup = new THREE.Group();
        const sonicRingGeo = new THREE.RingGeometry(2.3, 2.8, 24);
        const sonicRingMat = new THREE.MeshBasicMaterial({
            color: 0x7dd3fc,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.68
        });
        const sonicRing = new THREE.Mesh(sonicRingGeo, sonicRingMat);
        sonicRing.position.set(0, 1.35, -3.65);
        sonicGroup.add(sonicRing);

        const streakGeo = new THREE.BoxGeometry(0.12, 0.12, 3.8);
        const streakMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.78 });
        [[-2.15, 1.6, -1.2], [2.15, 1.6, -1.2], [-2.25, 0.9, 0.5], [2.25, 0.9, 0.5]].forEach(([sx, sy, sz]) => {
            const streak = new THREE.Mesh(streakGeo, streakMat);
            streak.position.set(sx, sy, sz);
            sonicGroup.add(streak);
        });
        sonicGroup.visible = false;
        bodyGroup.add(sonicGroup);

        // 4 Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.65, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });
        const rimMat = new THREE.MeshBasicMaterial({ color: accentHex });
        const wheels = [];

        [
            [-1.85, 0.85, -1.9],
            [ 1.85, 0.85, -1.9],
            [-1.85, 0.85,  1.9],
            [ 1.85, 0.85,  1.9]
        ].forEach(([wx, wy, wz]) => {
            const wheelGroup = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, tireMat);
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.68, 12).rotateZ(Math.PI / 2), rimMat);
            wheelGroup.add(tire, rim);
            wheelGroup.position.set(wx, wy, wz);
            carRoot.add(wheelGroup);
            wheels.push(wheelGroup);
        });

        scene.add(carRoot);
        return { root: carRoot, body: bodyGroup, wheels, flames, sonicGroup };
    }

    // Live 3D Showroom Car on Title Screen
    let showroomCarMesh = null;
    function rebuildShowroomCar() {
        if (showroomCarMesh) {
            scene.remove(showroomCarMesh.root);
        }
        showroomCarMesh = createCarMesh(selectedPrimaryHex, selectedAccentHex, selectedCarId);
        showroomCarMesh.root.scale.set(1.65, 1.65, 1.65);
        showroomCarMesh.root.position.set(-22, 0, 18);
        showroomCarMesh.root.visible = (gameState === 'START');
    }

    class Car {
        constructor(team, isPlayer, modelType = 'octane') {
            this.team = team;
            this.isPlayer = isPlayer;
            this.modelType = modelType;
            this.preset = CAR_PRESETS[modelType] || CAR_PRESETS.octane;
            this.primaryHex = team === 'blue' ? 0x2563eb : 0xea580c;
            this.accentHex = team === 'blue' ? 0x38bdf8 : 0xfacc15;
            this.visuals = createCarMesh(this.primaryHex, this.accentHex, this.modelType);

            this.pos = new THREE.Vector3();
            this.vel = new THREE.Vector3();
            // Full 3D Quaternion orientation so cars smoothly drive up curved walls & air-roll!
            this.quat = new THREE.Quaternion();
            this.surfaceNormal = new THREE.Vector3(0, 1, 0);
            this.surfaceType = 'TURF';

            this.boost = 50;
            this.grounded = true;
            this.jumpCount = 0;
            this.isBoosting = false;
            this.isDrifting = false;
            this.isAirRolling = false;
            this.supersonic = false;

            // Demolition & 3.0s Respawn State
            this.isDemolished = false;
            this.respawnTimer = 0;

            // Dodge-flip animation state
            this.flipTimer = 0;
            this.flipPitchDir = 0;
            this.flipRollDir = 0;

            this.radius = 2.6;
            this.reset();
        }

        setLoadout(modelType, primaryHex, accentHex) {
            this.modelType = modelType;
            this.preset = CAR_PRESETS[modelType] || CAR_PRESETS.octane;
            this.primaryHex = primaryHex;
            this.accentHex = accentHex;
            if (this.visuals && this.visuals.root) {
                scene.remove(this.visuals.root);
            }
            this.visuals = createCarMesh(this.primaryHex, this.accentHex, this.modelType);
            this.syncMesh(0);
        }

        reset() {
            this.vel.set(0, 0, 0);
            this.boost = 50;
            this.grounded = true;
            this.jumpCount = 0;
            this.isBoosting = false;
            this.isDrifting = false;
            this.isAirRolling = false;
            this.supersonic = false;
            this.isDemolished = false;
            this.respawnTimer = 0;
            this.visuals.root.visible = true;
            this.visuals.sonicGroup.visible = false;
            this.flipTimer = 0;
            this.visuals.body.rotation.set(0, 0, 0);
            this.surfaceNormal.set(0, 1, 0);
            this.surfaceType = 'TURF';

            if (this.team === 'blue') {
                this.pos.set(0, 0, 74);
                this.quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0); // Facing -Z
            } else {
                this.pos.set(0, 0, -74);
                this.quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI); // Facing +Z
            }
            this.syncMesh(0);
        }

        demolish() {
            this.isDemolished = true;
            this.respawnTimer = 3.0;
            this.isBoosting = false;
            this.isAirRolling = false;
            this.supersonic = false;
            this.vel.set(0, 0, 0);
            this.visuals.root.visible = false;
            this.visuals.sonicGroup.visible = false;
        }

        respawnInBackCorner(ballPos, opponentPos) {
            this.isDemolished = false;
            this.respawnTimer = 0;
            this.vel.set(0, 0, 0);
            this.boost = 33;
            this.grounded = true;
            this.jumpCount = 0;
            this.isBoosting = false;
            this.isDrifting = false;
            this.isAirRolling = false;
            this.supersonic = false;
            this.flipTimer = 0;
            this.visuals.body.rotation.set(0, 0, 0);
            this.surfaceNormal.set(0, 1, 0);
            this.surfaceType = 'TURF';

            const zCorner = this.team === 'blue' ? 104 : -104;
            const leftCorner = new THREE.Vector3(-56, 0, zCorner);
            const rightCorner = new THREE.Vector3(56, 0, zCorner);

            const leftSafety = leftCorner.distanceTo(ballPos) + leftCorner.distanceTo(opponentPos);
            const rightSafety = rightCorner.distanceTo(ballPos) + rightCorner.distanceTo(opponentPos);

            const chosenCorner = leftSafety >= rightSafety ? leftCorner : rightCorner;
            this.pos.copy(chosenCorner);
            this.quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.team === 'blue' ? 0 : Math.PI);

            this.visuals.root.visible = true;
            this.syncMesh(0);
            spawnRespawnFlash(this.pos, this.team);
            if (this.isPlayer) sfx.playRespawn();
        }

        getForwardVector() {
            return new THREE.Vector3(0, 0, -1).applyQuaternion(this.quat).normalize();
        }

        getRightVector() {
            return new THREE.Vector3(1, 0, 0).applyQuaternion(this.quat).normalize();
        }

        getUpVector() {
            return new THREE.Vector3(0, 1, 0).applyQuaternion(this.quat).normalize();
        }

        /**
         * Aligns car's local Up axis smoothly to the given surface normal while preserving its forward heading
         */
        alignToSurfaceNormal(targetNormal, blend = 1.0) {
            const currentUp = this.getUpVector();
            const deltaQuat = new THREE.Quaternion().setFromUnitVectors(currentUp, targetNormal);
            if (blend >= 0.999) {
                this.quat.premultiply(deltaQuat).normalize();
            } else {
                const targetQuat = deltaQuat.multiply(this.quat).normalize();
                this.quat.slerp(targetQuat, blend);
            }
        }

        triggerJump(throttleInput, steerInput) {
            if (this.isDemolished) return;
            if (this.grounded) {
                // Jump launches along the current surface normal (launches away from wall when wall-driving!)
                const jumpDir = this.surfaceNormal.clone();
                if (jumpDir.y < 0.25) {
                    // Wall-jump gets a slight upward lift so aerial wall-shots feel crisp
                    jumpDir.y += 0.28;
                    jumpDir.normalize();
                }
                this.vel.addScaledVector(jumpDir, PHYSICS.JUMP_IMPULSE);
                this.pos.addScaledVector(this.surfaceNormal, 0.65);
                this.grounded = false;
                this.jumpCount = 1;
                if (this.isPlayer) sfx.playJump(false);
            } else if (this.jumpCount === 1) {
                this.jumpCount = 2;
                this.vel.y = Math.max(this.vel.y * 0.45, 0) + PHYSICS.DOUBLE_JUMP_IMPULSE * 0.65;

                // Project forward/right onto horizontal plane for reliable directional dodge-flips
                const forward = this.getForwardVector();
                forward.y = 0;
                if (forward.lengthSq() < 0.01) forward.set(0, 0, -1);
                forward.normalize();
                const right = new THREE.Vector3(-forward.z, 0, forward.x);

                if (Math.abs(throttleInput) > 0.1 || Math.abs(steerInput) > 0.1) {
                    const dodgeDir = new THREE.Vector3()
                        .addScaledVector(forward, throttleInput)
                        .addScaledVector(right, steerInput)
                        .normalize();
                    this.vel.addScaledVector(dodgeDir, PHYSICS.FLIP_IMPULSE);
                    this.flipTimer = 0.46;
                    this.flipPitchDir = -throttleInput;
                    this.flipRollDir = -steerInput;
                }
                if (this.isPlayer) sfx.playJump(true);
            }
        }

        update(dt, controls) {
            if (this.isDemolished) return;

            const forward = this.getForwardVector();
            const right = this.getRightVector();
            const up = this.getUpVector();

            this.isBoosting = controls.boost && this.boost > 0.5;
            this.isDrifting = controls.drift && this.grounded;
            this.isAirRolling = false;

            if (this.grounded) {
                // --- GROUNDED / CURVED RAMP / WALL DRIVING ---
                const n = this.surfaceNormal;
                const forwardSpeed = this.vel.dot(forward);
                const reverseSign = forwardSpeed < -1.5 ? -1 : 1;
                const turnMultiplier = this.isDrifting ? PHYSICS.CAR_DRIFT_TURN_MULT : 1.0;
                const steerAuthority = Math.min(1, Math.abs(forwardSpeed) / 8 + 0.38);

                // Steer around the surface normal!
                const yawDelta = -controls.steer * PHYSICS.CAR_TURN_SPEED * this.preset.turnMult * turnMultiplier * steerAuthority * reverseSign * dt;
                const yawQuat = new THREE.Quaternion().setFromAxisAngle(n, yawDelta);
                this.quat.premultiply(yawQuat).normalize();

                // Recompute local axes after steering
                const curForward = this.getForwardVector();
                const curRight = this.getRightVector();

                // Drive Acceleration along surface
                if (controls.throttle !== 0) {
                    const accelRate = (controls.throttle > 0 ? PHYSICS.CAR_ACCEL : PHYSICS.CAR_ACCEL * 0.78) * this.preset.speedMult;
                    this.vel.addScaledVector(curForward, controls.throttle * accelRate * dt);
                }

                // Lateral Tire Grip along surface
                const lateralSpeed = this.vel.dot(curRight);
                const grip = this.isDrifting ? 2.4 : 12.0;
                this.vel.addScaledVector(curRight, -lateralSpeed * Math.min(1, grip * dt));

                // Gravity component tangent to the surface (pulls cars down steep walls if they lose speed!)
                const gravityVec = new THREE.Vector3(0, PHYSICS.GRAVITY, 0);
                const normalGrav = n.clone().multiplyScalar(gravityVec.dot(n));
                const tangentGrav = gravityVec.clone().sub(normalGrav);

                const planarSpeed = this.vel.length();
                const isSteepWall = n.y < 0.65;
                // Wall-stick traction: when moving fast enough on walls, tires hold grip against gravity;
                // if you slow down below ~18 units/s on a steep wall, gravity slides you smoothly down the curve!
                const wallTractionFactor = isSteepWall
                    ? THREE.MathUtils.clamp(1.0 - (planarSpeed - 12) / 14, 0.12, 1.0)
                    : 0.35;
                this.vel.addScaledVector(tangentGrav, wallTractionFactor * dt);

                // Rolling drag
                this.vel.multiplyScalar(1 - 0.58 * dt);

                // Downforce keeping wheels planted on quarter-pipe curves & walls
                this.vel.addScaledVector(n, -14 * dt);

                if (this.isBoosting) {
                    this.boost = Math.max(0, this.boost - 30 * dt);
                    this.vel.addScaledVector(curForward, PHYSICS.CAR_BOOST_ACCEL * this.preset.boostMult * dt);
                }
            } else {
                // --- AIRBORNE FLIGHT: PITCH, YAW & AIR ROLL! ---
                this.vel.y += PHYSICS.GRAVITY * dt;

                const airAgility = 0.85 + 0.15 * this.preset.turnMult;
                const pitchInput = controls.throttle; // W = nose down (-pitch), S = nose up (+pitch)
                const rollInput = controls.airRoll;   // Q = roll left (-1), E = roll right (+1)
                const yawInput = controls.steer;      // A/D = yaw left/right

                if (Math.abs(rollInput) > 0.05) {
                    this.isAirRolling = true;
                }

                // Local Pitch (around local Right axis)
                if (Math.abs(pitchInput) > 0.05) {
                    const pitchAngle = -pitchInput * PHYSICS.AIR_PITCH_SPEED * airAgility * dt;
                    const qPitch = new THREE.Quaternion().setFromAxisAngle(right, pitchAngle);
                    this.quat.premultiply(qPitch).normalize();
                }

                // Local Air Roll (around local Forward axis -Z)
                if (Math.abs(rollInput) > 0.05) {
                    // Positive rollInput (E / Roll Right) tilts roof to the right
                    const rollAngle = rollInput * PHYSICS.AIR_ROLL_SPEED * airAgility * dt;
                    const qRoll = new THREE.Quaternion().setFromAxisAngle(forward, rollAngle);
                    this.quat.premultiply(qRoll).normalize();
                }

                // Local Yaw (around local Up axis)
                if (Math.abs(yawInput) > 0.05) {
                    const yawAngle = -yawInput * PHYSICS.AIR_YAW_SPEED * airAgility * dt;
                    const qYaw = new THREE.Quaternion().setFromAxisAngle(up, yawAngle);
                    this.quat.premultiply(qYaw).normalize();
                }

                // Rocket Boost in mid-air propels along the car's nose direction!
                if (this.isBoosting) {
                    this.boost = Math.max(0, this.boost - 30 * dt);
                    const noseDir = this.getForwardVector();
                    this.vel.addScaledVector(noseDir, PHYSICS.CAR_BOOST_ACCEL * this.preset.boostMult * 0.92 * dt);
                    this.vel.y += 12.5 * dt;
                }

                if (this.isAirRolling) {
                    spawnAirRollTrail(this);
                }
            }

            // Clamp Total Speed & Check Supersonic Threshold
            const maxAllowed = (this.isBoosting ? PHYSICS.CAR_BOOST_MAX_SPEED : PHYSICS.CAR_MAX_SPEED) * this.preset.speedMult;
            const speed = this.vel.length();
            if (speed > maxAllowed) {
                this.vel.multiplyScalar(maxAllowed / speed);
            }
            this.supersonic = speed >= PHYSICS.SUPERSONIC_SPEED;

            // Integrate 3D Position
            this.pos.addScaledVector(this.vel, dt);

            // --- CURVED ARENA SURFACE COLLISION & LANDING RECOVERY ---
            const surf = queryArenaSurface(this.pos, 0.0);
            if (surf.signedDist <= 0.15) {
                const vn = this.vel.dot(surf.normal);
                // Attach to surface if moving into it or already driving along it
                if (vn <= 6.0 || this.grounded) {
                    this.pos.addScaledVector(surf.normal, -surf.signedDist);
                    if (vn < 0) {
                        this.vel.addScaledVector(surf.normal, -vn);
                    }
                    this.grounded = true;
                    this.jumpCount = 0;
                    this.surfaceNormal.copy(surf.normal);
                    this.surfaceType = surf.surfaceType;

                    // Smoothly align car's wheels/chassis to the curved ramp, wall, or floor normal!
                    this.alignToSurfaceNormal(surf.normal, Math.min(1, 18 * dt));
                }
            } else if (surf.signedDist > 0.85) {
                this.grounded = false;
                this.surfaceType = 'AIRBORNE';
            }

            // Clamp inside Goal Tunnel Back Net if inside goal mouth
            const maxGoalZ = ARENA.HALF_L + ARENA.GOAL_DEPTH - 2.5;
            if (this.pos.z < -maxGoalZ) {
                this.pos.z = -maxGoalZ;
                this.vel.z = Math.max(0, this.vel.z);
            } else if (this.pos.z > maxGoalZ) {
                this.pos.z = maxGoalZ;
                this.vel.z = Math.min(0, this.vel.z);
            }

            // Exhaust Flames & Supersonic Wind Trails
            if (this.isBoosting) {
                spawnBoostParticles(this);
            }
            if (this.supersonic) {
                spawnSupersonicWindParticles(this);
            }

            const forwardSpd = this.vel.dot(this.getForwardVector());
            this.syncMesh(dt, forwardSpd, controls.steer);
        }

        syncMesh(dt, forwardSpeed = 0, steer = 0) {
            this.visuals.root.position.copy(this.pos);
            this.visuals.root.quaternion.copy(this.quat);

            // Supersonic Wind-Tunnel Ring & Speed Streaks
            this.visuals.sonicGroup.visible = this.supersonic;
            if (this.supersonic) {
                const pulse = 0.94 + Math.sin(performance.now() * 0.025) * 0.09;
                this.visuals.sonicGroup.scale.set(pulse, pulse, 1);
            }

            // Wheel spin & front wheel steering
            this.visuals.wheels.forEach((w, idx) => {
                w.children[0].rotation.x -= forwardSpeed * dt * 0.85;
                if (idx < 2) {
                    w.rotation.y = -steer * 0.42;
                }
            });

            // Thruster flame cones
            this.visuals.flames.forEach(f => {
                f.visible = this.isBoosting;
                if (this.isBoosting) {
                    f.scale.set(1, 0.8 + Math.random() * 0.65, 1);
                }
            });

            // Dodge-Flip 360 Spin Animation on local body mesh
            if (this.flipTimer > 0) {
                this.flipTimer -= dt;
                const progress = 1 - Math.max(0, this.flipTimer / 0.46);
                const angle = progress * Math.PI * 2;
                this.visuals.body.rotation.x = this.flipPitchDir * angle;
                this.visuals.body.rotation.z = this.flipRollDir * angle;
            } else {
                this.visuals.body.rotation.x = THREE.MathUtils.lerp(this.visuals.body.rotation.x, -forwardSpeed * 0.0022, 0.2);
                this.visuals.body.rotation.z = THREE.MathUtils.lerp(this.visuals.body.rotation.z, steer * 0.08, 0.2);
            }
        }
    }

    // ==========================================
    // 9. SOCCER BALL PHYSICS ON CURVED QUARTER-PIPE WALLS
    // ==========================================
    function createBallTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(0, 0, 512, 256);

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 8;
        for (let x = 0; x <= 512; x += 64) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 256);
            ctx.stroke();
        }
        for (let y = 0; y <= 256; y += 64) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(512, y);
            ctx.stroke();
        }
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(0, 118, 512, 20);

        return new THREE.CanvasTexture(c);
    }

    class SoccerBall {
        constructor() {
            const geo = new THREE.SphereGeometry(PHYSICS.BALL_RADIUS, 32, 24);
            const mat = new THREE.MeshStandardMaterial({
                map: createBallTexture(),
                roughness: 0.30,
                metalness: 0.50
            });
            this.mesh = new THREE.Mesh(geo, mat);
            this.mesh.castShadow = true;
            scene.add(this.mesh);

            // Ground drop-indicator ring
            const ringGeo = new THREE.RingGeometry(PHYSICS.BALL_RADIUS * 0.85, PHYSICS.BALL_RADIUS * 1.18, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.48 });
            this.groundIndicator = new THREE.Mesh(ringGeo, ringMat);
            this.groundIndicator.rotation.x = -Math.PI / 2;
            this.groundIndicator.position.y = 0.08;
            scene.add(this.groundIndicator);

            this.pos = new THREE.Vector3();
            this.vel = new THREE.Vector3();
            this.reset();
        }

        reset() {
            this.pos.set(0, PHYSICS.BALL_RADIUS + 0.1, 0);
            this.vel.set(0, 0, 0);
            this.mesh.rotation.set(0, 0, 0);
            this.syncVisuals(0);
        }

        update(dt) {
            this.vel.y += PHYSICS.GRAVITY * 0.72 * dt;
            this.vel.multiplyScalar(1 - 0.12 * dt);

            const speed = this.vel.length();
            if (speed > PHYSICS.BALL_MAX_SPEED) {
                this.vel.multiplyScalar(PHYSICS.BALL_MAX_SPEED / speed);
            }

            if (speed > 42 && Math.random() < 0.65) {
                spawnBallTrailParticle(this.pos, this.vel);
            }

            this.pos.addScaledVector(this.vel, dt);
            const r = PHYSICS.BALL_RADIUS;

            // Check Goal Scoring before curved backboard clamping
            const insideGoalFrame = Math.abs(this.pos.x) < (ARENA.GOAL_HALF_W - r * 0.35) &&
                                    this.pos.y < (ARENA.GOAL_H - r * 0.25);

            if (insideGoalFrame) {
                if (this.pos.z < -(ARENA.HALF_L + r * 0.65)) {
                    return 'blue';
                } else if (this.pos.z > (ARENA.HALF_L + r * 0.65)) {
                    return 'orange';
                }
            }

            // Smooth Quarter-Pipe Curved Arena Collision & Rolling for the Ball!
            const surf = queryArenaSurface(this.pos, r);
            if (surf.signedDist < 0) {
                this.pos.addScaledVector(surf.normal, -surf.signedDist);
                const vn = this.vel.dot(surf.normal);
                if (vn < 0) {
                    if (vn < -4.0) {
                        // Elastic bounce off curved ramp, corner bowl, or wall
                        this.vel.addScaledVector(surf.normal, -(1 + PHYSICS.BALL_RESTITUTION) * vn);
                    } else {
                        // Smooth rolling up the quarter-pipe curve without losing tangential momentum!
                        this.vel.addScaledVector(surf.normal, -vn);
                    }
                    // Gentle surface rolling friction
                    this.vel.multiplyScalar(1 - 0.22 * dt);
                }
            }

            this.syncVisuals(dt);
            return null;
        }

        syncVisuals(dt) {
            this.mesh.position.copy(this.pos);
            if (dt > 0) {
                this.mesh.rotation.x += (this.vel.z / PHYSICS.BALL_RADIUS) * dt;
                this.mesh.rotation.z -= (this.vel.x / PHYSICS.BALL_RADIUS) * dt;
            }
            this.groundIndicator.position.x = THREE.MathUtils.clamp(this.pos.x, -ARENA.HALF_W + ARENA.CURVE_R, ARENA.HALF_W - ARENA.CURVE_R);
            this.groundIndicator.position.z = THREE.MathUtils.clamp(this.pos.z, -ARENA.HALF_L + ARENA.CURVE_R, ARENA.HALF_L - ARENA.CURVE_R);
            const heightScale = Math.max(0.45, 1 - (this.pos.y - PHYSICS.BALL_RADIUS) / 55);
            this.groundIndicator.scale.set(heightScale, heightScale, 1);
        }
    }

    // ==========================================
    // 10. PARTICLE & SHOCKWAVE FX SYSTEM
    // ==========================================
    const particles = [];
    const shockwaves = [];
    const particleGeo = new THREE.SphereGeometry(0.48, 6, 6);

    function spawnBallTrailParticle(pos, vel) {
        const mat = new THREE.MeshBasicMaterial({
            color: vel.z < 0 ? 0x38bdf8 : 0xfb923c,
            transparent: true,
            opacity: 0.45
        });
        const mesh = new THREE.Mesh(particleGeo, mat);
        mesh.position.copy(pos);
        scene.add(mesh);

        particles.push({
            mesh,
            vel: new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2),
            life: 0.25,
            maxLife: 0.25,
            scale: 2.2
        });
    }

    function spawnBoostParticles(car) {
        const forward = car.getForwardVector();
        const up = car.getUpVector();
        const spawnPos = car.pos.clone().addScaledVector(up, 1.25).addScaledVector(forward, -3.2);
        const colors = [0xf97316, 0xfacc15, 0xef4444];
        const mat = new THREE.MeshBasicMaterial({
            color: colors[Math.floor(Math.random() * colors.length)],
            transparent: true,
            opacity: 0.9
        });
        const mesh = new THREE.Mesh(particleGeo, mat);
        mesh.position.copy(spawnPos);
        scene.add(mesh);

        particles.push({
            mesh,
            vel: forward.clone().multiplyScalar(-15).add(new THREE.Vector3((Math.random()-0.5)*4, Math.random()*3, (Math.random()-0.5)*4)),
            life: 0.36,
            maxLife: 0.36,
            scale: 1.05
        });
    }

    function spawnAirRollTrail(car) {
        if (Math.random() > 0.65) return;
        const right = car.getRightVector();
        const up = car.getUpVector();
        const wingPos = car.pos.clone()
            .addScaledVector(up, 1.5)
            .addScaledVector(right, (Math.random() < 0.5 ? -2.0 : 2.0));

        const mat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.72
        });
        const mesh = new THREE.Mesh(particleGeo, mat);
        mesh.position.copy(wingPos);
        scene.add(mesh);

        particles.push({
            mesh,
            vel: new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, (Math.random()-0.5)*2),
            life: 0.26,
            maxLife: 0.26,
            scale: 0.65
        });
    }

    function spawnSupersonicWindParticles(car) {
        if (Math.random() > 0.55) return;
        const forward = car.getForwardVector();
        const right = car.getRightVector();
        const up = car.getUpVector();
        const side = Math.random() < 0.5 ? -2.0 : 2.0;
        const spawnPos = car.pos.clone()
            .addScaledVector(up, 0.75)
            .addScaledVector(right, side)
            .addScaledVector(forward, -2.0);

        const mat = new THREE.MeshBasicMaterial({
            color: 0x7dd3fc,
            transparent: true,
            opacity: 0.78
        });
        const mesh = new THREE.Mesh(particleGeo, mat);
        mesh.position.copy(spawnPos);
        scene.add(mesh);

        particles.push({
            mesh,
            vel: forward.clone().multiplyScalar(-18).add(new THREE.Vector3((Math.random()-0.5)*2, 1.5, (Math.random()-0.5)*2)),
            life: 0.28,
            maxLife: 0.28,
            scale: 0.68
        });
    }

    function spawnDemoExplosion(originPos) {
