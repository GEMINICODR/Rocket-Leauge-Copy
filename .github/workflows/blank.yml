    function spawnRespawnFlash(originPos, team) {
        const ringGeo = new THREE.RingGeometry(1.2, 2.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({
            color: team === 'blue' ? 0x38bdf8 : 0xfacc15,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2;
        ringMesh.position.set(originPos.x, 0.35, originPos.z);
        scene.add(ringMesh);
        shockwaves.push({ mesh: ringMesh, life: 0.48, maxLife: 0.48 });
