            const canopy = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.68, 2.8), cabinMat);
            canopy.position.set(0, 1.62, 0.15);
            canopy.castShadow = true;
            bodyGroup.add(canopy);

            const finL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 1.2), accentMat);
            finL.position.set(-1.55, 1.65, 2.6);
            bodyGroup.add(finL);

            const finR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 1.2), accentMat);
            finR.position.set(1.55, 1.65, 2.6);
            bodyGroup.add(finR);

            const wing = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.16, 0.85), bodyMat);
