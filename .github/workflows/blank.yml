    // ==========================================
    // 6. 3D STADIUM BUILDER WITH QUARTER-PIPE CURVED RAMPS & CORNER BOWLS
    // ==========================================
    function createPitchTexture() {
        const texCanvas = document.createElement('canvas');
        texCanvas.width = 1024;
        texCanvas.height = 1024;
        const ctx = texCanvas.getContext('2d');

        const stripes = 18;
        const stripeH = texCanvas.height / stripes;
        for (let i = 0; i < stripes; i++) {
            ctx.fillStyle = i % 2 === 0 ? '#114e34' : '#0c412a';
            ctx.fillRect(0, i * stripeH, texCanvas.width, stripeH);
        }

        const blueGrad = ctx.createLinearGradient(0, texCanvas.height * 0.72, 0, texCanvas.height);
        blueGrad.addColorStop(0, 'rgba(37, 99, 235, 0)');
        blueGrad.addColorStop(1, 'rgba(37, 99, 235, 0.36)');
        ctx.fillStyle = blueGrad;
        ctx.fillRect(0, texCanvas.height * 0.72, texCanvas.width, texCanvas.height * 0.28);

        const orangeGrad = ctx.createLinearGradient(0, 0, 0, texCanvas.height * 0.28);
        orangeGrad.addColorStop(0, 'rgba(234, 88, 12, 0.36)');
        orangeGrad.addColorStop(1, 'rgba(234, 88, 12, 0)');
        ctx.fillStyle = orangeGrad;
        ctx.fillRect(0, 0, texCanvas.width, texCanvas.height * 0.28);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.74)';
        ctx.lineWidth = 6;
        ctx.strokeRect(20, 20, texCanvas.width - 40, texCanvas.height - 40);

        ctx.beginPath();
        ctx.moveTo(20, texCanvas.height / 2);
        ctx.lineTo(texCanvas.width - 20, texCanvas.height / 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(texCanvas.width / 2, texCanvas.height / 2, 110, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath();
        ctx.arc(texCanvas.width / 2, texCanvas.height / 2, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeRect(texCanvas.width * 0.24, 20, texCanvas.width * 0.52, 145);
        ctx.strokeRect(texCanvas.width * 0.24, texCanvas.height - 165, texCanvas.width * 0.52, 145);

        const texture = new THREE.CanvasTexture(texCanvas);
        texture.anisotropy = 8;
        return texture;
    }

    /**
     * Builds a smooth 3D quarter-pipe curved ramp mesh along a straight segment
     */
    function createQuarterPipeSegmentMesh(length, radius, segments, mat) {
        const geo = new THREE.BufferGeometry();
        const vertices = [];
        const uvs = [];
        const indices = [];

        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const theta = t * (Math.PI / 2); // 0 = floor edge, PI/2 = vertical wall
            const localOut = Math.sin(theta) * radius;
            const localY = radius - Math.cos(theta) * radius;

            vertices.push(localOut, localY, -length / 2);
            vertices.push(localOut, localY,  length / 2);
            uvs.push(t, 0, t, 1);

            if (i < segments) {
                const a = i * 2;
                const b = a + 1;
                const c = a + 2;
                const d = a + 3;
                indices.push(a, c, b);
                indices.push(b, c, d);
            }
        }

        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, mat);
    }

    /**
     * Builds a smooth 3D curved corner bowl quarter-pipe connecting floor, corner wall, and side ramps
     */
    function createCurvedCornerBowlMesh(cornerRadius, curveRadius, arcSegs, tubeSegs, mat) {
        const geo = new THREE.BufferGeometry();
        const vertices = [];
        const indices = [];
        const innerFlatR = cornerRadius - curveRadius;

        for (let a = 0; a <= arcSegs; a++) {
            const phi = (a / arcSegs) * (Math.PI / 2);
            const cosP = Math.cos(phi);
            const sinP = Math.sin(phi);

            for (let t = 0; t <= tubeSegs; t++) {
                const theta = (t / tubeSegs) * (Math.PI / 2);
                const r = innerFlatR + Math.sin(theta) * curveRadius;
                const y = curveRadius - Math.cos(theta) * curveRadius;

                vertices.push(r * cosP, y, r * sinP);
            }
        }

        const stride = tubeSegs + 1;
        for (let a = 0; a < arcSegs; a++) {
            for (let t = 0; t < tubeSegs; t++) {
                const i0 = a * stride + t;
                const i1 = (a + 1) * stride + t;
                const i2 = a * stride + (t + 1);
                const i3 = (a + 1) * stride + (t + 1);
                indices.push(i0, i2, i1);
                indices.push(i1, i2, i3);
            }
        }

        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, mat);
    }

    function buildStadium() {
        const stadiumGroup = new THREE.Group();
        const R = ARENA.CURVE_R;
        const CR = ARENA.CORNER_R;

        // 1. Pitch Floor (170 x 260)
        const pitchGeo = new THREE.PlaneGeometry(ARENA.HALF_W * 2, ARENA.HALF_L * 2);
        const pitchMat = new THREE.MeshStandardMaterial({
            map: createPitchTexture(),
            roughness: 0.78,
            metalness: 0.08
        });
        const pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
        pitchMesh.rotation.x = -Math.PI / 2;
        pitchMesh.receiveShadow = true;
        stadiumGroup.add(pitchMesh);

        // 2. Visible Quarter-Pipe Curved Ramp Transitions (Left, Right, Backboards & 4 Corner Bowls)
        const rampMat = new THREE.MeshStandardMaterial({
            color: 0x0f2942,
            emissive: 0x0284c7,
            emissiveIntensity: 0.16,
            roughness: 0.35,
            metalness: 0.55,
            side: THREE.DoubleSide
        });

        const sideStraightLen = (ARENA.HALF_L - CR) * 2;
        // Right Side Ramp (+X)
        const rightRamp = createQuarterPipeSegmentMesh(sideStraightLen, R, 12, rampMat);
        rightRamp.position.set(ARENA.HALF_W - R, 0.03, 0);
        stadiumGroup.add(rightRamp);

        // Left Side Ramp (-X)
        const leftRamp = createQuarterPipeSegmentMesh(sideStraightLen, R, 12, rampMat);
        leftRamp.rotation.y = Math.PI;
        leftRamp.position.set(-(ARENA.HALF_W - R), 0.03, 0);
        stadiumGroup.add(leftRamp);

        // Backboard Curved Ramps flanking the Goals
        const backWingLen = (ARENA.HALF_W - CR) - ARENA.GOAL_HALF_W;
        if (backWingLen > 0.5) {
            const wingCenterX = ARENA.GOAL_HALF_W + backWingLen / 2;
            [
                { x:  wingCenterX, z:  ARENA.HALF_L - R, ry: -Math.PI / 2 },
                { x: -wingCenterX, z:  ARENA.HALF_L - R, ry: -Math.PI / 2 },
                { x:  wingCenterX, z: -(ARENA.HALF_L - R), ry: Math.PI / 2 },
                { x: -wingCenterX, z: -(ARENA.HALF_L - R), ry: Math.PI / 2 }
            ].forEach(cfg => {
                const backRamp = createQuarterPipeSegmentMesh(backWingLen, R, 12, rampMat);
                backRamp.rotation.y = cfg.ry;
                backRamp.position.set(cfg.x, 0.03, cfg.z);
                stadiumGroup.add(backRamp);
            });
        }

        // 4 Smooth Curved Corner Bowls
        [
            { cx:  ARENA.HALF_W - CR, cz:  ARENA.HALF_L - CR, ry: 0 },
            { cx:  ARENA.HALF_W - CR, cz: -(ARENA.HALF_L - CR), ry: Math.PI / 2 },
            { cx: -(ARENA.HALF_W - CR), cz: -(ARENA.HALF_L - CR), ry: Math.PI },
            { cx: -(ARENA.HALF_W - CR), cz:  ARENA.HALF_L - CR, ry: -Math.PI / 2 }
        ].forEach(c => {
            const bowl = createCurvedCornerBowlMesh(CR, R, 12, 12, rampMat);
            bowl.rotation.y = c.ry;
            bowl.position.set(c.cx, 0.03, c.cz);
            stadiumGroup.add(bowl);
        });

        // Glowing Guide Lines marking the base & top of the Quarter-Pipe Curve
        const curveGuideMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55 });
        const sideGuideGeo = new THREE.BoxGeometry(0.35, 0.25, sideStraightLen);
        [-1, 1].forEach(sx => {
            const floorEdge = new THREE.Mesh(sideGuideGeo, curveGuideMat);
            floorEdge.position.set(sx * (ARENA.HALF_W - R), 0.12, 0);
            stadiumGroup.add(floorEdge);

            const wallEdge = new THREE.Mesh(sideGuideGeo, curveGuideMat);
            wallEdge.position.set(sx * (ARENA.HALF_W - 0.15), R, 0);
            stadiumGroup.add(wallEdge);
        });

        // 3. Translucent Energy Arena Walls above the Quarter-Pipe Curve
        const wallMat = new THREE.MeshPhysicalMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.11,
            roughness: 0.2,
            side: THREE.DoubleSide
        });

        const upperWallH = ARENA.WALL_H - R;
        const sideWallGeo = new THREE.PlaneGeometry(sideStraightLen, upperWallH);
        const leftWall = new THREE.Mesh(sideWallGeo, wallMat);
        leftWall.position.set(-ARENA.HALF_W, R + upperWallH / 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        stadiumGroup.add(leftWall);

        const rightWall = new THREE.Mesh(sideWallGeo, wallMat);
        rightWall.position.set(ARENA.HALF_W, R + upperWallH / 2, 0);
        rightWall.rotation.y = -Math.PI / 2;
        stadiumGroup.add(rightWall);

        // Curved Vertical Corner Walls above y = R
        const cornerWallGeo = new THREE.CylinderGeometry(CR, CR, upperWallH, 14, 1, true, 0, Math.PI / 2);
        [
            { cx:  ARENA.HALF_W - CR, cz:  ARENA.HALF_L - CR, ry: 0 },
            { cx:  ARENA.HALF_W - CR, cz: -(ARENA.HALF_L - CR), ry: Math.PI / 2 },
            { cx: -(ARENA.HALF_W - CR), cz: -(ARENA.HALF_L - CR), ry: Math.PI },
            { cx: -(ARENA.HALF_W - CR), cz:  ARENA.HALF_L - CR, ry: -Math.PI / 2 }
        ].forEach(c => {
            const cw = new THREE.Mesh(cornerWallGeo, wallMat);
            cw.rotation.y = c.ry;
            cw.position.set(c.cx, R + upperWallH / 2, c.cz);
            stadiumGroup.add(cw);
        });

        // Back Wall Segments flanking the Goals
        const wingWidth = (ARENA.HALF_W - CR) - ARENA.GOAL_HALF_W;
        const wingGeo = new THREE.PlaneGeometry(wingWidth, upperWallH);
        const topHeaderH = ARENA.WALL_H - ARENA.GOAL_H;
        const headerGeo = new THREE.PlaneGeometry(ARENA.GOAL_HALF_W * 2, topHeaderH);

        [ARENA.HALF_L, -ARENA.HALF_L].forEach(zPos => {
            const leftWing = new THREE.Mesh(wingGeo, wallMat);
            leftWing.position.set(-(ARENA.GOAL_HALF_W + wingWidth / 2), R + upperWallH / 2, zPos);
            stadiumGroup.add(leftWing);

            const rightWing = new THREE.Mesh(wingGeo, wallMat);
            rightWing.position.set(ARENA.GOAL_HALF_W + wingWidth / 2, R + upperWallH / 2, zPos);
            stadiumGroup.add(rightWing);

            const header = new THREE.Mesh(headerGeo, wallMat);
            header.position.set(0, ARENA.GOAL_H + topHeaderH / 2, zPos);
            stadiumGroup.add(header);
        });

        // Upper Ceiling Neon Ring
        const ceilingTrimMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45 });
        const sideCeilingTrim = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, sideStraightLen), ceilingTrimMat);
        [-ARENA.HALF_W, ARENA.HALF_W].forEach(xPos => {
            const trim = sideCeilingTrim.clone();
            trim.position.set(xPos, ARENA.WALL_H, 0);
            stadiumGroup.add(trim);
        });

        // 4. Recessed Team Goals (Blue at +Z, Orange at -Z)
        function createGoalStructure(zSign, colorHex) {
            const goalGroup = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: 0.7,
                roughness: 0.25,
                metalness: 0.8
            });
            const netMat = new THREE.MeshBasicMaterial({
                color: colorHex,
                wireframe: true,
                transparent: true,
                opacity: 0.34
            });

            const zBase = zSign * ARENA.HALF_L;
            const zBack = zSign * (ARENA.HALF_L + ARENA.GOAL_DEPTH);

            const postGeo = new THREE.CylinderGeometry(0.8, 0.8, ARENA.GOAL_H, 16);
            const leftPost = new THREE.Mesh(postGeo, postMat);
            leftPost.position.set(-ARENA.GOAL_HALF_W, ARENA.GOAL_H / 2, zBase);
            goalGroup.add(leftPost);

            const rightPost = new THREE.Mesh(postGeo, postMat);
            rightPost.position.set(ARENA.GOAL_HALF_W, ARENA.GOAL_H / 2, zBase);
            goalGroup.add(rightPost);

            const barGeo = new THREE.CylinderGeometry(0.8, 0.8, ARENA.GOAL_HALF_W * 2 + 1.6, 16);
            const crossbar = new THREE.Mesh(barGeo, postMat);
            crossbar.rotation.z = Math.PI / 2;
            crossbar.position.set(0, ARENA.GOAL_H, zBase);
            goalGroup.add(crossbar);

            const lineGeo = new THREE.BoxGeometry(ARENA.GOAL_HALF_W * 2, 0.2, 1.0);
            const lineMesh = new THREE.Mesh(lineGeo, postMat);
            lineMesh.position.set(0, 0.1, zBase);
            goalGroup.add(lineMesh);

            const backNet = new THREE.Mesh(new THREE.PlaneGeometry(ARENA.GOAL_HALF_W * 2, ARENA.GOAL_H, 16, 8), netMat);
            backNet.position.set(0, ARENA.GOAL_H / 2, zBack);
            goalGroup.add(backNet);

            const roofNet = new THREE.Mesh(new THREE.PlaneGeometry(ARENA.GOAL_HALF_W * 2, ARENA.GOAL_DEPTH, 16, 8), netMat);
            roofNet.rotation.x = Math.PI / 2;
            roofNet.position.set(0, ARENA.GOAL_H, (zBase + zBack) / 2);
            goalGroup.add(roofNet);

            const sideNetGeo = new THREE.PlaneGeometry(ARENA.GOAL_DEPTH, ARENA.GOAL_H, 8, 8);
            const leftNet = new THREE.Mesh(sideNetGeo, netMat);
            leftNet.rotation.y = Math.PI / 2;
            leftNet.position.set(-ARENA.GOAL_HALF_W, ARENA.GOAL_H / 2, (zBase + zBack) / 2);
            goalGroup.add(leftNet);

            const rightNet = new THREE.Mesh(sideNetGeo, netMat);
            rightNet.rotation.y = -Math.PI / 2;
            rightNet.position.set(ARENA.GOAL_HALF_W, ARENA.GOAL_H / 2, (zBase + zBack) / 2);
            goalGroup.add(rightNet);

            return goalGroup;
        }

        stadiumGroup.add(createGoalStructure(1, 0x3b82f6));  // Blue Goal (+Z)
        stadiumGroup.add(createGoalStructure(-1, 0xf97316)); // Orange Goal (-Z)

        // 5. Stadium Floodlight Towers
        const towerMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 });
        const lampMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe });
        [
            [-104, -144], [104, -144], [-104, 144], [104, 144],
            [-108, -48], [108, -48], [-108, 48], [108, 48]
        ].forEach(([tx, tz]) => {
            const tower = new THREE.Mesh(new THREE.BoxGeometry(4, 76, 4), towerMat);
            tower.position.set(tx, 38, tz);
            stadiumGroup.add(tower);

            const lamp = new THREE.Mesh(new THREE.BoxGeometry(8, 3.2, 3.2), lampMat);
            lamp.position.set(tx, 76, tz);
            lamp.lookAt(0, 0, 0);
            stadiumGroup.add(lamp);
        });

        scene.add(stadiumGroup);
    }

    buildStadium();

    // ==========================================
    // 7. BOOST PADS (21 PADS: 6 LARGE 100% ORBS + 15 SMALL 25% PADS)
    // ==========================================
    const boostPads = [];

    function initBoostPads() {
        const padConfigs = [
            // 6 Large Corner & Mid-Side 100% Boost Orbs
            { x: -64, z: -102, big: true },
            { x:  64, z: -102, big: true },
            { x: -64, z:  102, big: true },
            { x:  64, z:  102, big: true },
            { x: -66, z:    0, big: true },
            { x:  66, z:    0, big: true },
            // 15 Small 25% Boost Pads
            { x:   0, z:  -92, big: false },
            { x: -36, z:  -76, big: false },
            { x:  36, z:  -76, big: false },
            { x:   0, z:  -52, big: false },
            { x: -42, z:  -34, big: false },
            { x:  42, z:  -34, big: false },
            { x: -34, z:    0, big: false },
            { x:   0, z:    0, big: false },
            { x:  34, z:    0, big: false },
            { x: -42, z:   34, big: false },
            { x:  42, z:   34, big: false },
            { x:   0, z:   52, big: false },
            { x: -36, z:   76, big: false },
            { x:  36, z:   76, big: false },
            { x:   0, z:   92, big: false }
        ];

        const baseGeo = new THREE.CylinderGeometry(1.8, 2.2, 0.25, 16);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.85, roughness: 0.25 });
        const orbMat = new THREE.MeshStandardMaterial({
            color: 0xfacc15,
            emissive: 0xf97316,
            emissiveIntensity: 0.9,
            roughness: 0.15
        });

        padConfigs.forEach(cfg => {
            const group = new THREE.Group();
            group.position.set(cfg.x, 0.12, cfg.z);

            const base = new THREE.Mesh(baseGeo, baseMat);
            if (cfg.big) base.scale.set(1.4, 1, 1.4);
            group.add(base);

            const orbGeo = cfg.big ? new THREE.OctahedronGeometry(1.6, 1) : new THREE.OctahedronGeometry(0.95, 0);
            const orb = new THREE.Mesh(orbGeo, orbMat);
            orb.position.y = cfg.big ? 2.0 : 1.15;
            group.add(orb);

            scene.add(group);
            boostPads.push({
                pos: new THREE.Vector3(cfg.x, 0, cfg.z),
                big: cfg.big,
                amount: cfg.big ? 100 : 25,
                radius: cfg.big ? 5.0 : 4.0,
                active: true,
                cooldown: 0,
                respawnTime: cfg.big ? 10 : 4,
                orbMesh: orb
            });
        });
    }

    initBoostPads();

    function updateBoostPads(dt) {
        const now = performance.now() * 0.003;
        for (const pad of boostPads) {
            if (!pad.active) {
                pad.cooldown -= dt;
                if (pad.cooldown <= 0) {
                    pad.active = true;
                    pad.orbMesh.visible = true;
                }
            } else {
                pad.orbMesh.rotation.y += dt * 2.6;
                pad.orbMesh.position.y = (pad.big ? 2.0 : 1.15) + Math.sin(now + pad.pos.x) * 0.26;
            }
        }
    }

    // ==========================================
    // 8. 4 DISTINCT 3D BATTLE-CAR MODELS & FULL 3D QUATERNION ORIENTATION
    // ==========================================
