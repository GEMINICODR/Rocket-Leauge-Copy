<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Arena 3D - Curved Walls & Air Roll Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <!-- Google Fonts: Orbitron & Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050914;
            font-family: 'Rajdhani', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .hud-glass {
            background: rgba(9, 14, 28, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .boost-ring-container {
            background: radial-gradient(circle, rgba(15, 23, 42, 0.94) 55%, rgba(249, 115, 22, 0.28) 100%);
            box-shadow: 0 0 28px rgba(249, 115, 22, 0.45), inset 0 0 16px rgba(0, 0, 0, 0.9);
        }
        @keyframes pulseScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .animate-banner {
            animation: pulseScale 0.75s infinite ease-in-out;
        }
        .touch-btn {
            background: rgba(15, 23, 42, 0.74);
            border: 2px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            transition: transform 0.08s, background 0.08s;
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(59, 130, 246, 0.68);
            border-color: #60a5fa;
            transform: scale(0.92);
        }
        .car-card {
            transition: all 0.18s ease;
        }
        .car-card.selected {
            background: rgba(37, 99, 235, 0.28);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }
        .swatch-btn {
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }
        .swatch-btn.selected {
            transform: scale(1.18);
            box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #ffffff;
        }
    </style>
</head>
<body class="text-white">

    <!-- 3D WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- IN-GAME HUD -->
    <div id="hud" class="hidden fixed inset-0 z-10 pointer-events-none flex flex-col justify-between p-3 sm:p-5">
        
        <!-- Top Scoreboard & Match Timer -->
        <div class="flex flex-col items-center w-full">
            <div class="hud-glass rounded-2xl px-4 sm:px-7 py-2 flex items-center gap-4 sm:gap-7 shadow-2xl border-t-2 border-t-white/25">
                <!-- Blue Team (Player) -->
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-[10px] sm:text-xs font-bold tracking-widest text-blue-400 uppercase">BLUE (YOU)</div>
                        <div id="hud-player-car-name" class="text-xs text-slate-300 font-semibold hidden sm:block">OCTANE RS</div>
                    </div>
                    <div id="score-blue" class="font-orbitron text-2xl sm:text-4xl font-black text-blue-400 drop-shadow-[0_0_12px_rgba(59,130,246,0.85)]">0</div>
                </div>

                <!-- Match Clock -->
                <div class="flex flex-col items-center px-3 sm:px-5 py-1 bg-slate-950/90 rounded-xl border border-slate-700/80">
                    <span id="match-timer" class="font-orbitron text-xl sm:text-3xl font-extrabold tracking-wider text-white">3:00</span>
                    <span id="match-status-tag" class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">REGULATION</span>
                </div>

                <!-- Orange Team (AI) -->
                <div class="flex items-center gap-3">
                    <div id="score-orange" class="font-orbitron text-2xl sm:text-4xl font-black text-orange-400 drop-shadow-[0_0_12px_rgba(249,115,22,0.85)]">0</div>
                    <div class="text-left">
                        <div class="text-[10px] sm:text-xs font-bold tracking-widest text-orange-400 uppercase">ORANGE (AI)</div>
                        <div id="hud-ai-car-name" class="text-xs text-slate-300 font-semibold hidden sm:block">DOMINUS GT</div>
                    </div>
                </div>
            </div>

            <!-- Quick Toggles & Wall/Air Status Badges -->
            <div class="mt-2 flex flex-wrap justify-center items-center gap-2 pointer-events-auto">
                <button id="btn-cam-toggle" class="hud-glass hover:bg-slate-800/90 text-xs font-bold tracking-wider px-3 py-1 rounded-full text-cyan-300 border border-cyan-500/30 transition cursor-pointer">
                    📷 BALL CAM: <span id="cam-mode-text" class="text-white">ON</span> [C]
                </button>
                <button id="btn-sound-toggle" class="hud-glass hover:bg-slate-800/90 text-xs font-bold tracking-wider px-3 py-1 rounded-full text-amber-300 border border-amber-500/30 transition cursor-pointer">
                    🔊 SFX: <span id="sound-mode-text" class="text-white">ON</span>
                </button>
                <div id="surface-status-pill" class="hud-glass text-xs font-orbitron font-bold tracking-wider px-3 py-1 rounded-full text-emerald-300 border border-emerald-500/30">
                    TURF GRIP
                </div>
            </div>

            <!-- Airborne Flight & Air-Roll HUD Indicator -->
            <div id="airborne-hud" class="opacity-0 transition-opacity duration-150 mt-2 hud-glass px-4 py-1.5 rounded-full border border-cyan-400/40 flex items-center gap-3 text-[11px] font-bold tracking-wider text-cyan-200 shadow-[0_0_18px_rgba(56,189,248,0.35)]">
                <span class="text-cyan-400 font-orbitron">✈️ AIRBORNE</span>
                <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-white">Q / E</kbd> Air Roll L/R</span>
                <span class="hidden sm:inline"><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-white">CTRL + A/D</kbd> Free Roll</span>
                <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-white">W / S</kbd> Pitch</span>
                <span><kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-white">SPACE</kbd> Flip</span>
            </div>
        </div>

        <!-- Center Banner (Countdown, Goal Celebration, Demolition Killfeed & Respawn Timer) -->
        <div id="center-banner" class="hidden self-center my-auto text-center px-6 py-4 rounded-3xl hud-glass border-2 border-white/25 shadow-2xl transform transition-all">
            <div id="banner-subtitle" class="text-xs sm:text-sm font-bold tracking-[0.3em] uppercase text-cyan-300 mb-1">GET READY</div>
            <div id="banner-title" class="font-orbitron text-4xl sm:text-6xl font-black tracking-tight text-white drop-shadow-[0_4px_20px_rgba(255,255,255,0.5)]">3</div>
            <div id="banner-detail" class="text-sm sm:text-base font-semibold text-slate-300 mt-1"></div>
        </div>

        <!-- Bottom HUD -->
        <div class="flex items-end justify-between w-full gap-2">
            
            <!-- Desktop Controls Guide -->
            <div class="hidden md:flex hud-glass rounded-2xl p-3.5 flex-col gap-1 text-xs text-slate-300 max-w-xs">
                <div class="font-orbitron text-[11px] font-bold text-blue-400 tracking-wider uppercase mb-0.5">Wall & Aerial Controls</div>
                <div class="flex justify-between gap-4"><span class="text-slate-400">Drive / Pitch / Yaw</span> <span class="font-bold text-white bg-slate-800 px-1.5 py-0.5 rounded">W A S D / Arrows</span></div>
                <div class="flex justify-between gap-4"><span class="text-slate-400">Rocket Boost</span> <span class="font-bold text-orange-400 bg-slate-800 px-1.5 py-0.5 rounded">SHIFT / Right-Click</span></div>
                <div class="flex justify-between gap-4"><span class="text-slate-400">Jump / Wall Jump / Flip</span> <span class="font-bold text-cyan-300 bg-slate-800 px-1.5 py-0.5 rounded">SPACE (x2)</span></div>
                <div class="flex justify-between gap-4"><span class="text-slate-400">Air Roll Left / Right</span> <span class="font-bold text-sky-300 bg-slate-800 px-1.5 py-0.5 rounded">Q / E (or CTRL+A/D)</span></div>
                <div class="flex justify-between gap-4"><span class="text-slate-400">Powerslide / Ball Cam</span> <span class="font-bold text-purple-300 bg-slate-800 px-1.5 py-0.5 rounded">CTRL / C</span></div>
            </div>

            <!-- Mobile / Touch Directional Pad -->
            <div class="flex md:hidden items-center gap-2 pointer-events-auto">
                <div class="grid grid-cols-3 gap-1.5 w-32 h-24">
                    <button data-key="KeyQ" class="touch-btn rounded-xl flex items-center justify-center font-orbitron font-bold text-[10px] text-sky-300">↺ L</button>
                    <button data-key="KeyW" class="touch-btn rounded-xl flex items-center justify-center font-bold text-lg">▲</button>
                    <button data-key="KeyE" class="touch-btn rounded-xl flex items-center justify-center font-orbitron font-bold text-[10px] text-sky-300">R ↻</button>
                    <button data-key="KeyA" class="touch-btn rounded-xl flex items-center justify-center font-bold text-lg">◀</button>
                    <button data-key="KeyS" class="touch-btn rounded-xl flex items-center justify-center font-bold text-lg">▼</button>
                    <button data-key="KeyD" class="touch-btn rounded-xl flex items-center justify-center font-bold text-lg">▶</button>
                </div>
            </div>

            <!-- Center Bottom Speedometer, Supersonic & Demolition Counter -->
            <div class="flex flex-col items-center mb-1">
                <div id="supersonic-badge" class="opacity-0 transition-opacity duration-150 px-3 py-0.5 rounded-full bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 text-slate-950 font-orbitron font-black text-[10px] sm:text-[11px] tracking-widest mb-1 shadow-[0_0_15px_rgba(56,189,248,0.85)]">
                    ⚡ SUPERSONIC • DEMO READY ⚡
                </div>
                <div class="hud-glass px-3.5 sm:px-5 py-1.5 rounded-full flex items-center gap-3">
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-slate-400 font-bold">SPEED</span>
                        <span id="speed-readout" class="font-orbitron text-base sm:text-lg font-extrabold text-white">0</span>
                        <span class="text-[10px] text-slate-400">KM/H</span>
                    </div>
                    <div class="h-4 w-px bg-slate-700"></div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[11px] text-rose-400 font-bold">💥 DEMOS</span>
                        <span id="hud-demos-count" class="font-orbitron text-base font-extrabold text-white">0</span>
                    </div>
                </div>
            </div>

            <!-- Right Bottom: Rocket Boost Circular Gauge + Mobile Actions -->
            <div class="flex items-center gap-3">
                <div class="flex md:hidden flex-col gap-2 pointer-events-auto">
                    <button data-key="ShiftLeft" class="touch-btn px-3 py-2.5 rounded-xl font-orbitron font-bold text-xs text-orange-400 border-orange-500/50">🔥 BOOST</button>
                    <div class="flex gap-1.5">
                        <button data-key="Space" class="touch-btn px-3 py-2.5 rounded-xl font-orbitron font-bold text-xs text-cyan-300 border-cyan-500/50">⬆ JUMP</button>
                        <button data-key="ControlLeft" class="touch-btn px-2.5 py-2.5 rounded-xl font-orbitron font-bold text-xs text-purple-300">DRIFT</button>
                    </div>
                </div>

                <!-- Circular Rocket Boost Meter -->
                <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full boost-ring-container flex items-center justify-center border-2 border-orange-500/45">
                    <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.1)" stroke-width="8" fill="transparent" />
                        <circle id="boost-arc" cx="50" cy="50" r="42" stroke="url(#boostGrad)" stroke-width="8" stroke-linecap="round" fill="transparent"
                                stroke-dasharray="263.89" stroke-dashoffset="0" />
                        <defs>
                            <linearGradient id="boostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#f97316" />
                                <stop offset="50%" stop-color="#fb923c" />
                                <stop offset="100%" stop-color="#facc15" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="boost-value" class="font-orbitron text-2xl sm:text-3xl font-black text-white leading-none">50</span>
                        <span class="text-[10px] font-bold tracking-widest text-orange-400 uppercase mt-0.5">BOOST</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- START SCREEN & GARAGE ("CHOOSE A CAR" MENU) -->
    <div id="start-screen" class="fixed inset-0 z-20 flex items-center justify-center p-3 sm:p-5 bg-slate-950/60 backdrop-blur-sm overflow-y-auto">
        <div class="hud-glass max-w-4xl w-full rounded-3xl p-5 sm:p-7 border border-white/15 shadow-[0_0_70px_rgba(37,99,235,0.4)] relative overflow-hidden my-auto">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-cyan-400 to-orange-500"></div>

            <!-- Title Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-white/10">
                <div>
                    <div class="inline-block px-2.5 py-0.5 rounded-full bg-blue-500/20 border border-blue-400/30 text-blue-300 text-[11px] font-bold tracking-widest uppercase mb-1">
                        Curved Walls & Aerial Air-Roll Edition • 170 × 260
                    </div>
                    <h1 class="font-orbitron text-3xl sm:text-4xl font-black tracking-tight text-white">
                        ROCKET <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-orange-400">ARENA 3D</span>
                    </h1>
                </div>
                <p class="text-slate-300 text-xs sm:text-sm max-w-xs">
                    Drive seamlessly up <span class="text-cyan-300 font-bold">curved quarter-pipe walls</span>, air-roll with <span class="text-sky-300 font-bold">Q / E</span>, and hit Supersonic demos!
                </p>
            </div>

            <!-- Main Grid: Left = Choose a Car Garage, Right = Match Settings & Controls -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mt-5">
                
                <!-- Left Column (7 cols): Choose a Car Selector -->
                <div class="lg:col-span-7 flex flex-col justify-between bg-slate-900/65 rounded-2xl p-4 border border-white/10">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="font-orbitron text-xs font-extrabold tracking-wider uppercase text-cyan-300">🏎️ Choose Your Battle-Car</span>
                            <span id="garage-selected-tag" class="text-xs font-bold text-white bg-blue-600/40 border border-blue-400/40 px-2.5 py-0.5 rounded-full">OCTANE RS</span>
                        </div>

                        <!-- 4 Car Cards Grid -->
                        <div id="car-cards-grid" class="grid grid-cols-2 gap-2.5 mb-4">
                            <button type="button" data-car="octane" class="car-card selected text-left p-3 rounded-xl bg-slate-800/75 border border-slate-700 hover:border-slate-500 cursor-pointer">
                                <div class="flex items-center justify-between">
                                    <span class="font-orbitron font-extrabold text-sm text-white">OCTANE RS</span>
                                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">BALANCED</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">Iconic rear-wing all-rounder for wall aerials, air-rolls & demos.</p>
                            </button>

                            <button type="button" data-car="dominus" class="car-card text-left p-3 rounded-xl bg-slate-800/75 border border-slate-700 hover:border-slate-500 cursor-pointer">
                                <div class="flex items-center justify-between">
                                    <span class="font-orbitron font-extrabold text-sm text-white">DOMINUS GT</span>
                                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-300">STRIKER</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">Wide flat muscle chassis built for power shots & heavy demos.</p>
                            </button>

                            <button type="button" data-car="fennec" class="car-card text-left p-3 rounded-xl bg-slate-800/75 border border-slate-700 hover:border-slate-500 cursor-pointer">
                                <div class="flex items-center justify-between">
                                    <span class="font-orbitron font-extrabold text-sm text-white">FENNEC TURBO</span>
                                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">AGILE</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">Compact rally hatchback with razor-sharp turns & fast air-roll.</p>
                            </button>

                            <button type="button" data-car="breakout" class="car-card text-left p-3 rounded-xl bg-slate-800/75 border border-slate-700 hover:border-slate-500 cursor-pointer">
                                <div class="flex items-center justify-between">
                                    <span class="font-orbitron font-extrabold text-sm text-white">BREAKOUT AERO</span>
                                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300">VELOCITY</span>
                                </div>
                                <p class="text-[11px] text-slate-400 mt-1">Low-profile wedge with top straight-line speed & wall grip.</p>
                            </button>
                        </div>

                        <!-- Stat Bars -->
                        <div class="space-y-2 bg-slate-950/65 p-3 rounded-xl border border-slate-800 mb-3">
                            <div>
                                <div class="flex justify-between text-[11px] font-bold mb-0.5">
                                    <span class="text-slate-400 uppercase">Top Speed</span>
                                    <span id="stat-val-speed" class="text-cyan-300 font-orbitron">84</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div id="stat-bar-speed" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-300" style="width: 84%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] font-bold mb-0.5">
                                    <span class="text-slate-400 uppercase">Boost Acceleration</span>
                                    <span id="stat-val-boost" class="text-orange-300 font-orbitron">86</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div id="stat-bar-boost" class="h-full bg-gradient-to-r from-orange-500 to-amber-400 rounded-full transition-all duration-300" style="width: 86%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] font-bold mb-0.5">
                                    <span class="text-slate-400 uppercase">Handling & Air Agility</span>
                                    <span id="stat-val-agility" class="text-emerald-300 font-orbitron">85</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div id="stat-bar-agility" class="h-full bg-gradient-to-r from-emerald-500 to-teal-300 rounded-full transition-all duration-300" style="width: 85%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Team Paint Color Swatches -->
                    <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Blue Team Paint Finish:</span>
                        <div id="paint-swatches" class="flex items-center gap-2.5">
                            <button type="button" data-primary="#2563eb" data-accent="#38bdf8" class="swatch-btn selected w-6 h-6 rounded-full bg-blue-600 cursor-pointer" title="Cobalt Blue"></button>
                            <button type="button" data-primary="#0284c7" data-accent="#7dd3fc" class="swatch-btn w-6 h-6 rounded-full bg-sky-500 cursor-pointer" title="Sky Interceptor"></button>
                            <button type="button" data-primary="#0d9488" data-accent="#5eead4" class="swatch-btn w-6 h-6 rounded-full bg-teal-500 cursor-pointer" title="Teal Pulse"></button>
                            <button type="button" data-primary="#4f46e5" data-accent="#a5b4fc" class="swatch-btn w-6 h-6 rounded-full bg-indigo-600 cursor-pointer" title="Hyper Indigo"></button>
                            <button type="button" data-primary="#7c3aed" data-accent="#e879f9" class="swatch-btn w-6 h-6 rounded-full bg-violet-600 cursor-pointer" title="Neon Ultraviolet"></button>
                        </div>
                    </div>
                </div>

                <!-- Right Column (5 cols): Match Settings, Controls & Kickoff -->
                <div class="lg:col-span-5 flex flex-col justify-between gap-3">
                    <div class="space-y-3">
                        <div class="bg-slate-900/75 p-3.5 rounded-2xl border border-slate-700/70">
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">AI Difficulty</label>
                            <select id="select-difficulty" class="w-full bg-slate-800 text-white font-bold text-sm rounded-xl px-3 py-2 border border-slate-600 focus:outline-none focus:border-blue-400 cursor-pointer">
                                <option value="rookie">Rookie (4 Varied Kickoffs)</option>
                                <option value="pro" selected>Pro (Competitive)</option>
                                <option value="allstar">All-Star (Aggressive)</option>
                            </select>
                        </div>

                        <div class="bg-slate-900/75 p-3.5 rounded-2xl border border-slate-700/70">
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Match Length</label>
                            <select id="select-duration" class="w-full bg-slate-800 text-white font-bold text-sm rounded-xl px-3 py-2 border border-slate-600 focus:outline-none focus:border-orange-400 cursor-pointer">
                                <option value="90">1:30 Blitz</option>
                                <option value="180" selected>3:00 Standard</option>
                                <option value="300">5:00 Championship</option>
                            </select>
                        </div>

                        <!-- Compact Controls Card -->
                        <div class="bg-slate-900/65 rounded-2xl p-3.5 border border-white/10 grid grid-cols-2 gap-2 text-xs">
                            <div class="p-2 rounded-xl bg-slate-800/65">
                                <div class="font-orbitron font-bold text-white text-[11px]">WASD / ARROWS</div>
                                <div class="text-slate-400 text-[11px]">Drive / Air Pitch & Yaw</div>
                            </div>
                            <div class="p-2 rounded-xl bg-slate-800/65">
                                <div class="font-orbitron font-bold text-sky-400 text-[11px]">Q / E (or CTRL+A/D)</div>
                                <div class="text-slate-400 text-[11px]">Air Roll Left & Right</div>
                            </div>
                            <div class="p-2 rounded-xl bg-slate-800/65">
                                <div class="font-orbitron font-bold text-orange-400 text-[11px]">SHIFT / R-CLICK</div>
